<!DOCTYPE html><html><head><meta charset="utf-8"><title>START</title></head><body><script>
function done(s){ document.title = s; }
try {
  fetch('chainsaw.m4a').then(function(r){
    if(!r.ok){ done('FETCH_ERR_'+r.status); return; }
    return r.arrayBuffer();
  }).then(function(buf){
    if(!buf){ done('NO_BUF'); return; }
    done('GOT_'+buf.byteLength);
    var AC = window.AudioContext || window.webkitAudioContext;
    if(!AC){ done('NO_AC'); return; }
    var ac = new AC();
    ac.decodeAudioData(buf).then(function(a){
      var ch=a.getChannelData(0), sr=a.sampleRate, N=a.length;
      // 快速算平均 RMS 和过零率
      var sum=0; for(var i=0;i<N;i+=8) sum+=ch[i]*ch[i];
      var rms=Math.sqrt(sum/(N/8));
      var zc=0; for(var i=1;i<N;i++) if((ch[i-1]<0)!==(ch[i]<0)) zc++;
      var dur=a.duration;
      // 主频粗估 = 过零率/2（对窄带信号近似）
      var f0 = zc/2/dur;
      done('OK dur='+dur.toFixed(2)+' rms='+rms.toFixed(3)+' zcRate='+f0.toFixed(0)+'Hz');
    }).catch(function(e){ done('DECODE_ERR_'+e); });
  }).catch(function(e){ done('FETCH_EX_'+e); });
} catch(e){ done('JS_ERR_'+e); }
</script></body></html>
