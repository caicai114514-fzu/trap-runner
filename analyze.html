<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{background:#000;color:#0f0}</style></head><body>
<div id="out">...</div>
<script>
var out=document.getElementById('out');
function log(s){ out.innerHTML += s+'<br>'; }
fetch('chainsaw.m4a').then(r=>r.arrayBuffer()).then(buf=>{
  var AC = window.AudioContext || window.webkitAudioContext;
  var ac = new AC();
  return ac.decodeAudioData(buf).then(function(audio){
    var ch = audio.getChannelData(0), sr = audio.sampleRate, dur = audio.duration;
    log('DUR='+dur.toFixed(3)+' SR='+sr);
    var seg=Math.floor(dur/0.05), env=[];
    for(var i=0;i<seg;i++){
      var s=Math.floor(i*sr*0.05),e=Math.floor((i+1)*sr*0.05),sum=0,pk=0;
      for(var j=s;j<e;j++){var v=ch[j];sum+=v*v;pk=Math.max(pk,Math.abs(v));}
      env.push(Math.sqrt(sum/(e-s)).toFixed(2));
    }
    log('ENV='+env.join(','));
    var fftSize=4096, mid=Math.floor(ch.length/2);
    var re=new Float32Array(fftSize);
    for(var k=0;k<fftSize;k++) re[k]=ch[mid+k];
    function goertzel(freq){
      var w=2*Math.PI*freq/sr, coeff=2*Math.cos(w), s0=0,s1=0,s2=0;
      for(var i=0;i<fftSize;i++){ s0=re[i]+coeff*s1-s2; s2=s1; s1=s0; }
      return s1*s1+s2*s2-coeff*s1*s2;
    }
    var peaks=[];
    for(var f=40;f<=6000;f+=40) peaks.push([f,goertzel(f)]);
    peaks.sort(function(a,b){return b[1]-a[1];});
    var mx=peaks[0][1], pl=[];
    for(var i=0;i<12;i++) pl.push(peaks[i][0]+':'+(peaks[i][1]/mx).toFixed(2));
    log('PEAKS='+pl.join(','));
    document.title='OK';
  });
}).catch(function(e){ log('ERR='+e); document.title='ERR'; });
</script></body></html>
