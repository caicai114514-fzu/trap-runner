/* 蹄子一样的一对恶魔角：牛角式内弯 */
function demonHorn(x, y, len, th, dir, fill, edge) {
  ctx.save(); ctx.translate(x, y); ctx.scale(dir, 1);
  function P(t) {
    var a = (1 - t) * (1 - t), b = 2 * (1 - t) * t, c = t * t;
    return [b * th * 1.55 + c * th * 0.16, -(b * len * 0.56 + c * len)];
  }
  var N = 26, L = [], R = [];
  for (var i = 0; i <= N; i++) {
    var t = i / N, p = P(t), q = P(Math.min(1, t + 0.02));
    var dx = q[0] - p[0], dy = q[1] - p[1], d = Math.hypot(dx, dy) || 1;
    var nx = -dy / d, ny = dx / d, w = th * Math.pow(1 - t, 0.62);
    L.push([p[0] + nx * w, p[1] + ny * w]);
    R.push([p[0] - nx * w, p[1] - ny * w]);
  }
  ctx.beginPath();
  ctx.moveTo(L[0][0], L[0][1]);
  L.forEach(function (p) { ctx.lineTo(p[0], p[1]); });
  for (var k = R.length - 1; k >= 0; k--) ctx.lineTo(R[k][0], R[k][1]);
  ctx.closePath();
  ctx.fillStyle = fill; ctx.fill();
  ctx.strokeStyle = edge; ctx.lineWidth = 1.8; ctx.lineJoin = 'round'; ctx.stroke();
  ctx.restore();
}

/* 险路尽头的门：血色光晕 + 一对牛角 + 门里一对眼睛 + 底部熔岩 + 门槛短牙 */
function hellDoor(cx, cy, w, h, color, opt) {
  var locked = !!opt.locked;
  var x = cx - w / 2, y = cy - h / 2, r = w / 2;
  var t = performance.now() / 1000;
  var pulse = 0.5 + 0.5 * Math.sin(t * 2.4);
  var k = locked ? 0.55 : 1;

  var rg = ctx.createRadialGradient(cx, cy, 4, cx, cy, w * 2.1);
  rg.addColorStop(0, 'rgba(255,59,47,' + ((0.20 + 0.12 * pulse) * k).toFixed(3) + ')');
  rg.addColorStop(1, 'rgba(255,59,47,0)');
  ctx.fillStyle = rg;
  ctx.beginPath(); ctx.ellipse(cx, cy + 8, w * 2.1, h * 1.7, 0, 0, 7); ctx.fill();

  var hFill = locked ? mix(color, '#1a0707', 0.52) : mix(color, '#1a0707', 0.14);
  var hEdge = locked ? mix(color, '#100202', 0.80) : '#2a0806';
  demonHorn(cx - r * 0.60, y + 18, 46, 13, -1, hFill, hEdge);
  demonHorn(cx + r * 0.60, y + 18, 46, 13, 1, hFill, hEdge);

  ctx.beginPath();
  ctx.moveTo(x - 9, y + h + 9); ctx.lineTo(x - 9, y + r);
  ctx.arc(cx, y + r, r + 9, Math.PI, 0);
  ctx.lineTo(x + w + 9, y + h + 9); ctx.closePath();
  ctx.fillStyle = '#1a0503'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,90,60,' + (0.5 * k + 0.3 * k * pulse).toFixed(3) + ')';
  ctx.lineWidth = 2.5; ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x, y + h); ctx.lineTo(x, y + r);
  ctx.arc(cx, y + r, r, Math.PI, 0);
  ctx.lineTo(x + w, y + h); ctx.closePath();
  var g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, locked ? mix(color, '#1a0707', 0.42) : '#ff6b48');
  g.addColorStop(0.55, locked ? mix(color, '#1a0707', 0.62) : mix(color, '#1a0707', 0.15));
  g.addColorStop(1, locked ? mix(color, '#1a0707', 0.78) : mix(color, '#1a0707', 0.62));
  ctx.fillStyle = g; ctx.fill();

  if (!locked) {
    ctx.save();
    ctx.globalAlpha = 0.55 + 0.45 * pulse;
    ctx.fillStyle = '#ffe08a';
    ctx.beginPath(); ctx.ellipse(cx - 11, y + h * 0.44, 4.2, 6.6, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cx + 11, y + h * 0.44, 4.2, 6.6, 0, 0, 7); ctx.fill();
    ctx.restore();
  }

  var nT = 5, tw = (w * 0.88) / nT;
  for (var i = 0; i < nT; i++) {
    var tx = cx - w * 0.44 + tw * (i + 0.5);
    ctx.beginPath();
    ctx.moveTo(tx - tw * 0.36, y + h);
    ctx.lineTo(tx, y + h - 10);
    ctx.lineTo(tx + tw * 0.36, y + h);
    ctx.closePath();
    ctx.fillStyle = hFill; ctx.fill();
    ctx.strokeStyle = hEdge; ctx.lineWidth = 1.3; ctx.lineJoin = 'round'; ctx.stroke();
  }

  ctx.save();
  ctx.globalAlpha = k;
  var lg = ctx.createLinearGradient(0, y + h - 18, 0, y + h + 16);
  lg.addColorStop(0, 'rgba(255,138,74,0)');
  lg.addColorStop(1, 'rgba(255,90,40,' + (0.45 + 0.3 * pulse).toFixed(3) + ')');
  ctx.fillStyle = lg;
  ctx.beginPath(); ctx.ellipse(cx, y + h + 7, w * 1.0, 17, 0, 0, 7); ctx.fill();
  ctx.restore();

  if (locked) {
    ctx.save(); ctx.globalAlpha = 0.26; ctx.fillStyle = '#120303';
    ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + r);
    ctx.arc(cx, y + r, r, Math.PI, 0); ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill();
    ctx.restore();
    ctx.save();
    ctx.shadowColor = 'rgba(255,110,70,0.95)'; ctx.shadowBlur = 16;
    lockIcon(cx, cy + 7, 1.75, '#ef8663');
    ctx.restore();
  }
}

/* 普通门：拱形门洞 */
function doorShape(cx, cy, w, h, color, opt) {
  opt = opt || {};
  if (opt.demon) { hellDoor(cx, cy, w, h, color, opt); return; }
  var x = cx - w / 2, y = cy - h / 2, r = w / 2;
  ctx.save(); ctx.globalAlpha = opt.locked ? 0.07 : 0.20;
  ctx.fillStyle = color;
  ctx.beginPath(); ctx.ellipse(cx, cy + 4, w * 1.15, h * 0.82, 0, 0, 7); ctx.fill(); ctx.restore();

  ctx.beginPath();
  ctx.moveTo(x - 5, y + h + 5); ctx.lineTo(x - 5, y + r);
  ctx.arc(cx, y + r, r + 5, Math.PI, 0); ctx.lineTo(x + w + 5, y + h + 5); ctx.closePath();
  ctx.fillStyle = '#170607'; ctx.fill();

  ctx.beginPath();
  ctx.moveTo(x, y + h); ctx.lineTo(x, y + r);
  ctx.arc(cx, y + r, r, Math.PI, 0); ctx.lineTo(x + w, y + h); ctx.closePath();
  var g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, opt.locked ? mix(color, '#1a0707', 0.48) : color);
  g.addColorStop(1, opt.locked ? mix(color, '#1a0707', 0.66) : color + '99');
  ctx.fillStyle = g; ctx.fill();

  if (!opt.locked) {
    ctx.save(); ctx.globalAlpha = 0.5; ctx.strokeStyle = color; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(cx, y + r + 8); ctx.lineTo(cx, y + h - 6); ctx.stroke(); ctx.restore();
  }
  if (opt.locked) {
    ctx.fillStyle = 'rgba(10,3,5,0.42)';
    ctx.beginPath(); ctx.moveTo(x, y + h); ctx.lineTo(x, y + r);
    ctx.arc(cx, y + r, r, Math.PI, 0); ctx.lineTo(x + w, y + h); ctx.closePath(); ctx.fill();
    ctx.save();
    ctx.shadowColor = 'rgba(255,180,140,0.55)'; ctx.shadowBlur = 10;
    lockIcon(cx, cy + 6, 1.5, PAL.faint);
    ctx.restore();
  }
  if (opt.done) {
    ctx.fillStyle = PAL.player;
    ctx.beginPath(); ctx.arc(cx + w * 0.62, cy - h * 0.40, 13, 0, 7); ctx.fill();
    ctx.strokeStyle = PAL.ink; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(cx + w * 0.62 - 6, cy - h * 0.40);
    ctx.lineTo(cx + w * 0.62 - 2, cy - h * 0.40 + 5);
    ctx.lineTo(cx + w * 0.62 + 6, cy - h * 0.40 - 5);
    ctx.stroke();
  }
}

/* 光标指示：选中元素上方一个上下浮动的小三角 */

}

/* ---------------- 第一级：选大关 ---------------- */
function drawWorldSelect() {
  var g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, '#24060c'); g.addColorStop(1, '#140305');
  ctx.fillStyle = g; ctx.fillRect(0, 0, VW, VH);

  roundRect(-40, 452, 420, 140, 18); ctx.fill();
  roundRect(560, 486, 480, 120, 18); ctx.fill();
  ctx.globalAlpha = 1;

  menuHeader(null, false);
  drawMenuHelp('← →  选路      空格 / 点击  进入      按 N 直接通关当前关        A / B / C  拿钥匙（调试）');

  // 曲折路径
  var pts = DOOR_POS.map(function (d) { return { x: d.x, y: d.y + 34 }; });
  ctx.strokeStyle = '#4a3428'; ctx.lineWidth = 6; ctx.lineCap = 'round'; ctx.setLineDash([2, 16]);
  ctx.beginPath(); ctx.moveTo(pts[0].x, pts[0].y);
  for (var i = 1; i < pts.length; i++) {
    var a = pts[i - 1], b = pts[i];
    var mx = (a.x + b.x) / 2 + (i === 2 ? -40 : 30);
    var my = (a.y + b.y) / 2 + (i === 2 ? 110 : (i === 1 ? 92 : -40));
    ctx.quadraticCurveTo(mx, my, b.x, b.y);
  }
  ctx.stroke(); ctx.setLineDash([]);

  for (var d2 = 0; d2 < 4; d2++) {
    var W = WORLDS[d2], p = DOOR_POS[d2];
    var unlocked = worldUnlocked(d2);
    var opt = { locked: !unlocked, demon: !!W.demon, done: worldCleared(d2) };
    doorShape(p.x, p.y, 62, 78, W.color, opt);
    text(W.name, p.x, p.y + 74, 15, unlocked ? PAL.text : PAL.dim, 'center', true);
  }
  cursorMark(DOOR_POS[game.cursorW].x, DOOR_POS[game.cursorW].y - 62);

  if (game.tauntT > 0) {
    ctx.save(); ctx.globalAlpha = Math.min(1, game.tauntT / 0.4);
    text(game.flash, VW / 2, 132, 22, PAL.player, 'center', true);
    ctx.restore();
  }
}

/* ---------------- 第二级：选小关 ---------------- */
function drawLevelSelect() {
  var W = WORLDS[game.levelsWorld];
  applyWorldPalette(game.levelsWorld);   // 界面里的平台色也跟着这个主题
  var g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, W.bg); g.addColorStop(1, W.bgDeep);

  drawMenuHelp('← →  选关      空格 / 点击  进入      R 返回');

  // 底部配图：每个大关讲自己那关的故事
  if (game.levelsWorld === 0) decorGround(W);
  else if (game.levelsWorld === 1) decorIllusion(W);
  else if (game.levelsWorld === 2) decorMachine(W);
  else decorDemon(W);

  // 关卡之间的虚线小路
  ctx.strokeStyle = W.terrEdge; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.setLineDash([2, 13]);
  for (var i = 0; i < LEVEL_POS.length - 1; i++) {
    var a = LEVEL_POS[i], b = LEVEL_POS[i + 1];
    ctx.beginPath(); ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo((a.x + b.x) / 2, (a.y + b.y) / 2 + (i % 2 ? 42 : -42), b.x, b.y);
    ctx.stroke();
  }
  ctx.setLineDash([]);

  for (var k = 0; k < LEVELS_PER_WORLD; k++) {
    var n = LEVEL_POS[k];

    var open = levelUnlocked(game.levelsWorld, k);
    var keyIdx = (game.levelsWorld < 3) ? KEY_LEVEL[game.levelsWorld] : -1;
    var isKey = (k === keyIdx);              // 每个大关只有一个小关藏钥匙

    if (cleared) {
      ctx.fillStyle = PAL.ground; ctx.beginPath(); ctx.arc(n.x, n.y, 26, 0, 7); ctx.fill();
      ctx.strokeStyle = PAL.groundTop; ctx.lineWidth = 3; ctx.stroke();
      ctx.strokeStyle = PAL.player; ctx.lineWidth = 3.6; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(n.x - 9, n.y + 1); ctx.lineTo(n.x - 3, n.y + 8); ctx.lineTo(n.x + 10, n.y - 7);
      ctx.stroke();
    } else if (open) {
      var pu = 0.5 + 0.5 * Math.sin(performance.now() / 260);
      ctx.globalAlpha = 0.20 + 0.28 * pu; ctx.fillStyle = W.color;
      ctx.beginPath(); ctx.arc(n.x, n.y, 39, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      ctx.fillStyle = W.color; ctx.beginPath(); ctx.arc(n.x, n.y, 26, 0, 7); ctx.fill();
      ctx.fillStyle = PAL.ink;

/* ---------------- 第二级底部配图 ---------------- */
function gearShape(cx, cy, r, teeth, body, hole) {
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = body; ctx.beginPath();
  var step = Math.PI * 2 / teeth;
  for (var i = 0; i < teeth; i++) {
    var a = i * step - Math.PI / 2, w = step * 0.30;
    ctx.lineTo(Math.cos(a - w) * r * 0.78, Math.sin(a - w) * r * 0.78);
    ctx.lineTo(Math.cos(a - w * 0.60) * r, Math.sin(a - w * 0.60) * r);
    ctx.lineTo(Math.cos(a + w * 0.60) * r, Math.sin(a + w * 0.60) * r);
    ctx.lineTo(Math.cos(a + w) * r * 0.78, Math.sin(a + w) * r * 0.78);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = hole;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.34, 0, 7); ctx.fill();
  ctx.restore();
}
function sawShape(cx, cy, r, body, hole) {
  ctx.save(); ctx.translate(cx, cy);
  ctx.fillStyle = body; ctx.beginPath();
  var N = 9, step = Math.PI * 2 / N;
  for (var i = 0; i < N; i++) {
    var a = i * step - Math.PI / 2;
    ctx.lineTo(Math.cos(a) * r * 0.58, Math.sin(a) * r * 0.58);
    ctx.lineTo(Math.cos(a + step * 0.60) * r * 1.02, Math.sin(a + step * 0.60) * r * 1.02);
  }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = hole;
  ctx.beginPath(); ctx.arc(0, 0, r * 0.17, 0, 7); ctx.fill();
  ctx.restore();
}
function menuArrow(x, y, ang, color, s) {
  s = s || 1;
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang); ctx.scale(s, s);
  ctx.fillStyle = color; ctx.beginPath();
  ctx.moveTo(-15, -6); ctx.lineTo(5, -6); ctx.lineTo(5, -13);
  ctx.lineTo(21, 0); ctx.lineTo(5, 13); ctx.lineTo(5, 6); ctx.lineTo(-15, 6);
  ctx.closePath(); ctx.fill(); ctx.restore();
}
function dashedSpike(x, y, w, h, color) {
  ctx.save();
  ctx.strokeStyle = color; ctx.lineWidth = 2.2; ctx.setLineDash([5, 4]); ctx.lineJoin = 'round';
  ctx.beginPath();
  ctx.moveTo(x, y); ctx.lineTo(x + w / 2, y - h); ctx.lineTo(x + w, y);
  ctx.closePath(); ctx.stroke();
  ctx.setLineDash([]); ctx.restore();
}
function pistonColumn(x, top, w, body, head) {
  ctx.fillStyle = body; ctx.fillRect(x, top, w, 470 - top);
  ctx.fillStyle = head; ctx.fillRect(x, top, w, 5);
}
/* 一只盯着鼠标看的眼睛 */
function watchingEye(cx, cy, r) {
  var mx = game.mouse ? game.mouse.x : VW * 0.24;
  var my = game.mouse ? game.mouse.y : VH * 0.26;
  var dx = mx - cx, dy = my - cy, d = Math.hypot(dx, dy) || 1;
  var off = Math.min(r * 0.30, d * 0.09);
  var ix = cx + dx / d * off, iy = cy + dy / d * off;
  var irisR = r * 0.46;

  ctx.fillStyle = '#e6d2c4';
  ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.64, 0, 0, 7); ctx.fill();
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.64, 0, 0, 7); ctx.clip();
  ctx.strokeStyle = 'rgba(170,50,38,0.42)'; ctx.lineWidth = 1.3; ctx.lineCap = 'round';
  [[-0.86, -0.30, -0.30, -0.10], [-0.72, 0.34, -0.20, 0.16],
   [0.55, -0.42, 0.92, -0.18], [0.30, 0.40, 0.80, 0.22]].forEach(function (s) {
    ctx.beginPath();
    ctx.moveTo(cx + s[0] * r, cy + s[1] * r * 0.64);
    ctx.quadraticCurveTo(cx + (s[0] + s[2]) / 2 * r, cy + (s[1] + s[3]) / 2 * r * 0.64,
                         cx + s[2] * r, cy + s[3] * r * 0.64);
    ctx.stroke();
  });
  ctx.restore();
  ctx.fillStyle = '#8a2418';
  ctx.beginPath(); ctx.arc(ix, iy, irisR, 0, 7); ctx.fill();
  ctx.fillStyle = '#0a0305';
  ctx.beginPath(); ctx.arc(ix, iy, irisR * 0.44, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.82)';
  ctx.beginPath(); ctx.arc(ix - irisR * 0.34, iy - irisR * 0.38, irisR * 0.20, 0, 7); ctx.fill();
  ctx.strokeStyle = '#5a1810'; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.ellipse(cx, cy, r, r * 0.64, 0, 0, 7); ctx.stroke();
}

/* 过关时：门一边收窄，一边用「背景色」从两侧把人的像素擦掉。
   只裁剪在人的包围盒里画，所以只有人会被擦掉，场景不受影响 ——
   效果就是"人被背景吃进去了"，不是把人压扁。 */
function drawWinCover() {
  var d = game.winDoor, p = game.p;
  if (!d || d.k >= 1) return;
  var g = LEVELS[game.li].goal;
  var halfFull = (g.w + 9) / 2;                 // 门全开时的半宽（含门框）
  var k = Math.max(0, d.k);                     // 门完全收掉后 k=0
  var halfNow = halfFull * k;                   // 现在洞口的半宽
  var cover = halfFull - halfNow;               // 两侧各被吃掉多少（k=0 时正好盖满）

  ctx.save();
  ctx.beginPath();
  ctx.rect(p.x - 4, p.y - 4, p.w + 8, p.h + 8);   // 只在人身上动刀
  ctx.clip();
  ctx.fillStyle = PAL.bgDeep;                     // 用背景色把人的像素擦掉
  ctx.fillRect(d.cx - halfFull, g.y - 8, cover, g.h + 16);
  ctx.fillRect(d.cx + halfNow, g.y - 8, cover, g.h + 16);
  ctx.restore();
}

/* ============================================================
   过场动画：两扇红门从两侧合上 → 停顿 → 打开
   进关卡和出关卡都放一次，节奏统一。
   ============================================================ */
var TRANS = { on: false, t: 0, mid: null, midDone: false };
var TRANS_CLOSE = 0.30, TRANS_HOLD = 0.26, TRANS_OPEN = 0.30;

function startTransition(midCb) {
  TRANS.on = true; TRANS.t = 0;
  TRANS.mid = midCb || null; TRANS.midDone = false;
}
function updateTransition(dt) {
  TRANS.t += dt;
  // 门合上的那一刻执行回调（换场景），这样开门时露出的已经是新画面
  if (!TRANS.midDone && TRANS.t >= TRANS_CLOSE) {
    TRANS.midDone = true;
    if (TRANS.mid) TRANS.mid();
  }
  if (TRANS.t >= TRANS_CLOSE + TRANS_HOLD + TRANS_OPEN) {
    TRANS.on = false; TRANS.mid = null;
  }
}
/* 门的开合进度：0 = 完全打开，1 = 完全合上 */
function transK() {
  var t = TRANS.t;
  if (t < TRANS_CLOSE) {
    var a = t / TRANS_CLOSE; return a * a * (3 - 2 * a);
  }
  if (t < TRANS_CLOSE + TRANS_HOLD) return 1;
  var b = (t - TRANS_CLOSE - TRANS_HOLD) / TRANS_OPEN;
  b = Math.min(1, b); b = b * b * (3 - 2 * b);
  return 1 - b;
}

/* 关门那条边的锯齿轮廓：整局只生成一次，左右两扇共用同一条缝线。
   共用是关键 —— 合上时严丝合缝，不会"各画各的对不上"。
   形状是折线（尖刺）而不是台阶：相邻点一凸一凹，每个齿都是尖的。
   参考 Level Devil 平台下沿那种齿：**小而密**，一屏几十个。 */
var JAG = null;
function jagProfile() {
  if (JAG) return JAG;
  JAG = [];
  var seed = 20261016;
  function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
  var y = -30, sign = 1;                     // 从屏幕外开始，上下各多留一截
  while (y < VH + 30) {
    var d = sign * (5 + rnd() * 8);          // 尖刺幅度 5~13（小）
    JAG.push({ y: y, d: d });
    sign = -sign;                            // 一凸一凹交替 → 每个齿都是尖的
    y += 7 + rnd() * 9;                      // 段高 7~16（密，一屏约 45 个齿）
  }
  JAG.push({ y: VH + 30, d: 0 });
  return JAG;
}

/* 一扇红门板：外侧贴屏幕边，内侧（关门那一边）走尖刺锯齿。
   k 是合门进度，用来在完全合上后把缝上的高光淡掉。 */
function redDoorPanel(half, fromLeft, k) {
  if (half <= 0.5) return;
  var J = jagProfile();
  var seam = fromLeft ? half : (VW - half);      // 这一扇的缝线基准位置
  var bx0 = fromLeft ? 0 : VW - half, bx1 = fromLeft ? half : VW;
  var yTop = J[0].y, yBot = J[J.length - 1].y;

  // 1) 门板形状：内侧是折线尖刺
  ctx.beginPath();
  ctx.moveTo(fromLeft ? 0 : VW, yTop);
  for (var i = 0; i < J.length; i++) ctx.lineTo(seam + J[i].d, J[i].y);
  ctx.lineTo(fromLeft ? 0 : VW, yBot);
  ctx.closePath();

  // 2) 在门板形状里铺质感
  ctx.save();
  ctx.clip();
  var g = ctx.createLinearGradient(bx0, 0, bx1, 0);
  if (fromLeft) { g.addColorStop(0, '#4e0c07'); g.addColorStop(0.72, '#96201a'); g.addColorStop(1, '#b32a20'); }
  else          { g.addColorStop(0, '#b32a20'); g.addColorStop(0.28, '#96201a'); g.addColorStop(1, '#4e0c07'); }
  ctx.fillStyle = g;
  ctx.fillRect(bx0 - 70, 0, (bx1 - bx0) + 140, VH);

  // 竖向木纹
  ctx.strokeStyle = 'rgba(0,0,0,0.20)'; ctx.lineWidth = 3;
  for (var m = 1; m * 52 < half + 70; m++) {
    var lx = fromLeft ? m * 52 : VW - m * 52;
    ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, VH); ctx.stroke();
  }
  // 横向压条
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  [VH * 0.20, VH * 0.80].forEach(function (yy) { ctx.fillRect(bx0 - 70, yy - 4, (bx1 - bx0) + 140, 8); });
  ctx.restore();

  // 3) 沿尖刺描一条亮边。完全合上后就不要这条线了（合上了不该还亮着一条缝）
  var fade = Math.max(0, 1 - Math.max(0, (k - 0.72) / 0.28));
  if (fade > 0.01) {
    ctx.save();
    ctx.globalAlpha = fade;
    ctx.beginPath();
    for (var n = 0; n < J.length; n++) {
      var xx = seam + J[n].d;
      if (n === 0) ctx.moveTo(xx, J[n].y); else ctx.lineTo(xx, J[n].y);
    }
    ctx.strokeStyle = '#ff6b48'; ctx.lineWidth = 3; ctx.lineJoin = 'miter'; ctx.stroke();
    ctx.restore();
  }
}

function drawTransition() {
  if (!TRANS.on) return;
  var k = transK();
  var half = (VW / 2) * k;
  if (half <= 0.5) return;
  redDoorPanel(half, true, k);
  redDoorPanel(half, false, k);
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, VW, VH);

  drawScene();
  if (TRANS.on) drawTransition();     // 过场门永远盖在最上面
}

function drawScene() {
  if (game.state === 'title') { drawTitle(); return; }
  if (game.state === 'complete') { drawComplete(); return; }
  if (game.state === 'world') { drawWorldSelect(); return; }
  if (game.state === 'levels') { drawLevelSelect(); return; }

  var sx = 0, sy = 0;
  if (game.shake > 0) {
    sx = (Math.random() - 0.5) * game.shake;
    sy = (Math.random() - 0.5) * game.shake;
  }
  drawBackground();
  ctx.save();
  ctx.translate(-Math.round(game.cam) + sx, sy);
  drawPlatforms();
  drawArrows();
  drawSpikes();
  drawSaws();
  drawCoins();
  drawButtonWall();
  drawKeys();
  drawBalls();
  drawGoal();
  drawPlayer();
  if (game.state === 'win') drawWinCover();
  drawParticles();
  ctx.restore();
  drawHUD();
}

/* ---------------- 主循环 ---------------- */
var last = 0;
function loop(ts) {
  if (!last) last = ts;
  var dt = Math.min(0.033, (ts - last) / 1000);
  last = ts;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* 调试：?screen=world|levels|demon|play|win  可以直接跳到某个界面看效果
         ?w=0..3   指定大关（play / win 用）
         ?p=0.30   win 时把过关动画冻结在指定进度 */
(function () {
  if (typeof location === 'undefined' || !location.search) return;
  var m = location.search.match(/screen=(\w+)/);
  if (!m) return;
  var wq = parseInt((location.search.match(/w=(\d)/) || [])[1] || '0', 10);
  var lvq = (location.search.match(/lv=(\d+)/) || [])[1];
  if (m[1] === 'world') game.state = 'world';
  else if (m[1] === 'levels') { game.levelsWorld = wq; game.state = 'levels'; }
  else if (m[1] === 'demon') { game.levelsWorld = 3; game.state = 'levels'; }
  else if (m[1] === 'play') {
    if (lvq !== undefined) { applyWorldPalette(wq); loadLevel(parseInt(lvq, 10)); } else loadSlot(wq, 0);
    var pq = parseFloat((location.search.match(/p=([\d.]+)/) || [])[1] || '0');
    for (var q = 0; q < Math.round(pq / (1 / 60)); q++) update(1 / 60);
  }
  else if (m[1] === 'win') {                  // 冻结在过关动画的某个进度看效果
    loadSlot(wq, 0);
    winLevel();
    var wp = parseFloat((location.search.match(/p=([\d.]+)/) || [])[1] || '0');
    for (var i = 0; i < Math.round(wp / (1 / 60)); i++) update(1 / 60);
  }
  else if (m[1] === 'die') {                  // 直接把玩家放到锯片上撞死，看死亡表现
    if (lvq !== undefined) { applyWorldPalette(wq); loadLevel(parseInt(lvq, 10)); } else loadSlot(wq, 0);
    var sw0 = game.saws[0];
    if (sw0) { game.p.x = sw0.x - game.p.w / 2; game.p.y = sw0.y - game.p.h / 2; }
    var dp = parseFloat((location.search.match(/p=([\d.]+)/) || [])[1] || '0.2');
    for (var d2 = 0; d2 < Math.round(dp / (1 / 60)); d2++) update(1 / 60);
  }
  else if (m[1] === 'vanish') {               // 让小人踩上消失板，看往左缩的动画
    if (lvq !== undefined) { applyWorldPalette(wq); loadLevel(parseInt(lvq, 10)); } else loadSlot(wq, 0);
    var vp0 = game.plats.filter(function (x) { return x.kind === 'vanish' || x.kind === 'fake'; })[0];
    if (vp0) { game.p.x = vp0.x + 20; game.p.y = vp0.y - game.p.h - 4; game.p.vy = 0; }
    var vq = parseFloat((location.search.match(/p=([\d.]+)/) || [])[1] || '0');
    for (var v2 = 0; v2 < Math.round(vq / (1 / 60)); v2++) update(1 / 60);
  }
  else if (m[1] === 'trans') {                // 冻结在过场红门的某个进度
    loadSlot(wq, 0);
    startTransition(function () {});
    var tp = parseFloat((location.search.match(/p=([\d.]+)/) || [])[1] || '0');
    for (var k = 0; k < Math.round(tp / (1 / 60)); k++) update(1 / 60);
  }
})();

requestAnimationFrame(loop);

})();
</script>
</body>
</html>
