    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center}
  canvas{display:block;background:#2b0b12;border-radius:10px;
    box-shadow:0 24px 70px rgba(0,0,0,.75);max-width:100%;max-height:100%}
</style>

<script>
(function () {
'use strict';

var canvas = document.getElementById('c');
var ctx = canvas.getContext('2d');
var VW = canvas.width, VH = canvas.height;

/* 开始页的播放按钮：正方形边框 + 里面一个三角形 */
var START_BTN = { x: Math.round(VW / 2 - 46), y: Math.round(VH / 2 + 44), w: 92, h: 92 };

/* ==================================================================
   音频引擎：Web Audio 程序化芯片音乐 + 音效（不需要任何音频文件）
   ================================================================== */
var Sound = {
  ac: null, master: null, bgmGain: null, sfxGain: null,
  started: false, step: 0, nextTime: 0, timer: null,
  bpm: 138,

  init: function () {
    if (this.ac) return;
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    this.ac = new AC();
    this.master = this.ac.createGain();
    this.master.gain.value = 0.5;
    this.master.connect(this.ac.destination);
    this.bgmGain = this.ac.createGain();
    this.bgmGain.gain.value = 0.28;
    this.bgmGain.connect(this.master);
    this.sfxGain = this.ac.createGain();
    this.sfxGain.gain.value = 0.5;
    this.sfxGain.connect(this.master);
  },

  freq: function (midi) { return 440 * Math.pow(2, (midi - 69) / 12); },

  // 一个音符
  note: function (midi, t, dur, type, vol, dest) {
    if (!this.ac) return;
    var o = this.ac.createOscillator();
    var g = this.ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(this.freq(midi), t);
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol == null ? 0.3 : vol, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(dest || this.bgmGain);
    o.start(t); o.stop(t + dur + 0.02);
  },

  noise: function (t, dur, vol) {
    if (!this.ac) return;
    var n = Math.floor(this.ac.sampleRate * dur);
    var buf = this.ac.createBuffer(1, n, this.ac.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    var s = this.ac.createBufferSource(); s.buffer = buf;
    var g = this.ac.createGain(); g.gain.value = vol == null ? 0.25 : vol;
    var f = this.ac.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 1400;
    s.connect(f); f.connect(g); g.connect(this.sfxGain);
    s.start(t);
  },

  sfxJump: function () {
    if (!this.ac) return;
    var t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = 'square';
    o.frequency.setValueAtTime(320, t);
    o.frequency.exponentialRampToValueAtTime(760, t + 0.09);
    g.gain.setValueAtTime(0.22, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
    o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t + 0.14);
  },

  sfxDeath: function () {
    if (!this.ac) return;
    var t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(420, t);
    o.frequency.exponentialRampToValueAtTime(60, t + 0.42);
    g.gain.setValueAtTime(0.3, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t + 0.47);
    this.noise(t, 0.3, 0.18);
  },

  sfxBounce: function () {          // 跳板弹起：一声低沉的"噗"，不刺耳
    if (!this.ac) return;
    var t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = 'triangle';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(620, t + 0.13);
    g.gain.setValueAtTime(0.16, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);
    o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t + 0.20);
    this.noise(t, 0.06, 0.07);
  },

  sfxChainsaw: function () {       // 链锯：照参考音频——中低频锯齿，4 次间歇"嗡——嗡——嗡"
    if (!this.ac) return;
    var t = this.ac.currentTime;

    // 4 次爆发，每次间隔 0.9 秒（参考音频包络：1.8/2.8/3.7/4.6s 各有一次峰值）
    for (var burst = 0; burst < 4; burst++) {
      var bt = t + burst * 0.9;

      // 主音：350Hz 锯齿（参考频谱最强峰），转速不稳地抖
      (function (bt) {
        var o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = 'sawtooth';
        for (var i = 0; i < 16; i++) {
          o.frequency.setValueAtTime(330 + Math.random() * 60, bt + i * 0.018);
        }
        g.gain.setValueAtTime(0.0001, bt);
        g.gain.exponentialRampToValueAtTime(0.30, bt + 0.05);   // 快速起音
        g.gain.setValueAtTime(0.30, bt + 0.15);
        g.gain.exponentialRampToValueAtTime(0.0001, bt + 0.30); // 渐弱收尾
        o.connect(g); g.connect(this.sfxGain);
        o.start(bt); o.stop(bt + 0.32);
      }).call(this, bt);

      // 次音：150Hz 方波（低八度，参考频谱第二强峰），给"轰鸣"打底
      (function (bt) {
        var o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = 'square';
        for (var i = 0; i < 16; i++) {
          o.frequency.setValueAtTime(145 + Math.random() * 20, bt + i * 0.02);
        }
        g.gain.setValueAtTime(0.0001, bt);
        g.gain.exponentialRampToValueAtTime(0.20, bt + 0.06);
        g.gain.setValueAtTime(0.20, bt + 0.15);
        g.gain.exponentialRampToValueAtTime(0.0001, bt + 0.30);
        o.connect(g); g.connect(this.sfxGain);
        o.start(bt); o.stop(bt + 0.32);
      }).call(this, bt);
    }
  },

  sfxCoin: function () {          // 吃真金币：两音上行，清脆
    if (!this.ac) return;
    var t = this.ac.currentTime;
    this.note(88, t, 0.10, 'square', 0.20, this.sfxGain);
    this.note(95, t + 0.07, 0.18, 'square', 0.18, this.sfxGain);
  },

  sfxBoom: function () {          // 假金币爆炸：低频冲击 + 两层噪声，要够吓人
    if (!this.ac) return;
    var t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = 'sawtooth';
    o.frequency.setValueAtTime(180, t);
    o.frequency.exponentialRampToValueAtTime(28, t + 0.55);
    g.gain.setValueAtTime(0.5, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    o.connect(g); g.connect(this.sfxGain); o.start(t); o.stop(t + 0.62);
    this.noise(t, 0.45, 0.40);
    this.noise(t + 0.03, 0.30, 0.30);
  },

  sfxWin: function () {
    if (!this.ac) return;
    var t = this.ac.currentTime, seq = [72, 76, 79, 84], self = this;
    seq.forEach(function (m, i) { self.note(m, t + i * 0.09, 0.3, 'triangle', 0.3, self.sfxGain); });
  },

  sfxTrap: function () {
    if (!this.ac) return;
    var t = this.ac.currentTime;
    this.noise(t, 0.08, 0.2);
    this.note(46, t, 0.12, 'square', 0.22, this.sfxGain);
  },

  sfxAllClear: function () {
    if (!this.ac) return;
    var t = this.ac.currentTime, self = this;
    [69, 72, 76, 81, 84, 88].forEach(function (m, i) {
      self.note(m, t + i * 0.11, 0.5, 'triangle', 0.32, self.sfxGain);
    });
  },

  // 芯片 BGM：Am - F - C - G 循环
  progression: [
    { bass: 45, arp: [57, 60, 64, 60] },  // Am
    { bass: 41, arp: [53, 57, 60, 57] },  // F
    { bass: 48, arp: [55, 60, 64, 60] },  // C
    { bass: 43, arp: [55, 59, 62, 59] }   // G
  ],

  startBgm: function () {
    if (!this.ac || this.started) return;
    this.started = true;
    this.nextTime = this.ac.currentTime + 0.08;
    this.step = 0;
    var self = this;
    this.timer = setInterval(function () { self.schedule(); }, 25);
  },

  schedule: function () {
    if (!this.ac) return;
    var spb = 60 / this.bpm;      // 每拍秒数
    var stepDur = spb / 4;        // 十六分音符
    while (this.nextTime < this.ac.currentTime + 0.12) {
      var s = this.step % 16;
      var bar = Math.floor(this.step / 16) % 4;
      var ch = this.progression[bar];
      var t = this.nextTime;
      // 低音：每拍一下
      if (s % 4 === 0) this.note(ch.bass - 12, t, stepDur * 3.2, 'triangle', 0.42);
      if (s % 4 === 2) this.note(ch.bass, t, stepDur * 1.6, 'triangle', 0.26);
      // 琶音
      if (s % 2 === 0) {
        var n = ch.arp[(s / 2) % 4];
        this.note(n + 12, t, stepDur * 1.5, 'square', 0.13);
      }
      // 偶尔加个高音点缀
      if (s === 14) this.note(ch.arp[2] + 24, t, stepDur * 1.2, 'square', 0.08);
      this.nextTime += stepDur;
      this.step++;
    }
  },

  toggle: function () {
    if (!this.bgmGain) return;
    var on = this.bgmGain.gain.value > 0.01;
    this.bgmGain.gain.setTargetAtTime(on ? 0 : 0.28, this.ac.currentTime, 0.05);
    return !on;
  }
};

   （width 必须等于视口宽 VW，相机算法会自动锁死在 0）

var KEY_LEVEL = [1, 3, 2];

/* 每个大关一套关卡内配色：平台 / 机关 / 背景都跟着主题走。
   平台：保留明暗关系，把色相往主题色上拉。
   机关：统一用"比背景再深一点"的同色系 —— 会融进场景里，
         不再靠亮色提醒你"这里有危险"。留一点明暗差，仔细看还是分得出来。 */
function applyWorldPalette(w) {
  var W = WORLDS[w] || WORLDS[0];
  var c = W.color;
  // 机关色：以本关背景为底，再压深一档（delta 负值 = 稍微亮一点）
  var TRAP_DARK = 0.34;
  function trapShade(delta) {
    return mix(PAL.bg, '#000000', Math.max(0, Math.min(1, TRAP_DARK + delta)));
  }

  // 关卡背景：比菜单的深底提亮一档。
  // 深色机关必须比背景更深才立得住，背景太黑的话它们就没地方待了。
  PAL.bg     = mix(W.bg, c, 0.17);
  PAL.bgDeep = PAL.bg;                       // 纯色，不再有下半部分那条
  // 平台
  PAL.ground    = mix('#7d5a44', c, 0.38);   // 平台主体
  PAL.groundTop = mix('#ff8a4a', c, 0.62);   // 平台顶边（最抢眼的一条）
  // 机关
  PAL.spike     = trapShade(0.08);
  PAL.piston    = trapShade(-0.02);
  PAL.pistonTop = trapShade(-0.26);          // 活塞顶盖留点亮，不然完全看不见
  PAL.appear    = trapShade(-0.20);
  PAL.vanish    = trapShade(-0.08);
  // 锯片例外：它是高速移动的东西，藏起来就是耍赖 —— 用亮金属色，一眼看得见
  PAL.saw       = mix('#d8c9b2', c, 0.26);
  // 假地板不是"机关"：它要装成正常地板，所以贴着平台色
  PAL.fake      = mix('#734f38', c, 0.28);
}

var SAVE_KEY = 'trap-runner-save-v1';
var save = { cleared:{}, keys:{}, deaths:0 };

function loadSave() {
  var o = null;
  try {
    var raw = localStorage.getItem(SAVE_KEY);
    if (raw) o = JSON.parse(raw);
  } catch (e) {}
  /* 注意：这里要"原地改"，不能 save = {...} 整个换对象 ——
     换了之后 __TRAP__.save 这类外部引用就指向旧对象了。 */
  save.cleared = (o && typeof o.cleared === 'object' && o.cleared) || {};
  save.keys    = (o && typeof o.keys    === 'object' && o.keys)    || {};
  save.deaths  = (o && typeof o.deaths  === 'number') ? o.deaths : 0;
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); } catch (e) {}
}
function resetSave() {
  save.cleared = {}; save.keys = {}; save.deaths = 0;
  writeSave();
}

function keyCount() {
  var n = 0;
  for (var w = 0; w < 3; w++) if (save.keys[w]) n++;
  return n;
}
function isCleared(w, i) { return !!save.cleared[w + '-' + i]; }
function worldCleared(w) {
  for (var i = 0; i < LEVELS_PER_WORLD; i++) if (!isCleared(w, i)) return false;
  return true;
}
function worldUnlocked(w) {
  if (w === 0) return true;
  if (w === 3) return keyCount() >= 3;          // 险路尽头：集齐三把钥匙才开
  return worldCleared(w - 1);
}
function levelUnlocked(w, i) {
  if (!worldUnlocked(w)) return false;
  if (i === 0) return true;
  return isCleared(w, i - 1);
}
function markCleared(w, i) {
  save.cleared[w + '-' + i] = 1;
  writeSave();
}
function giveKey(w) {
  save.keys[w] = 1;
  writeSave();
  Sound.sfxWin();
}

}

function loadLevel(i) {
  var L = LEVELS[i];
  game.li = i;
  game.p = {
    x: L.spawn[0], y: L.spawn[1], vx: 0, vy: 0, w: 26, h: 28,
    onGround: false, face: 1, alive: true, sq: 1, ground: null,
    anim: 0, animState: 'idle'
  };
  // 复制平台/尖刺的可变状态
  game.plats = L.platforms.map(function (p) {
    var isPiston = p.kind === 'piston';
    return {
      x: p.x, y: p.y, w: p.w, h: p.h, kind: p.kind,
      state: (p.kind === 'appear' || isPiston) ? 'hidden' : 'active',
      triggerX: p.triggerX || 0, timer: 0, appeared: 0,
      // 默认全实心：从下面顶头、从侧面会挡住。
      // （早期为了修"卡板边"把薄平台做成单向，代价是跳上去的途中会从板身里穿过去，
      //   看起来像穿模。现在改成：要平台单向得在关卡数据里显式写 oneWay: true）
      oneWay: !!p.oneWay || p.kind === 'bounce',   // 跳板必须单向，否则弹起后会被自己顶头清零
      x0: p.x,
      w0: p.w,                  // 消失板收缩动画用的原始宽度
      retractT: p.retractT || 0.20,   // 收缩用时（越小消失越快）
      pop: 0,                          // bounce 跳板：皮鼓起来的进度 0~1
      popped: false,
      sinkT2: p.sinkTime || 0.26,     // pitFloor 往下缩用时
      sunk: false,
      y0: p.y,                  // sinkFloor 下沉用的原始高度
      moveV: p.moveV || 0,      // 会走的障碍：出现后自己移动，把玩家顶走
      moveTo: p.moveTo || 0,
      baseY: p.y,               // 活塞：原始高度（升降都相对它算）
      phase: isPiston ? 'hidden' : '', phaseT: 0,
      isWall: !!p.isWall,
      deadly: !!p.deadly,
      riseT: 0, risePhase: 'idle', riseY: 0,  // riseWall：升起的墙
      slideWall: !!p.slideWall            // 3-3：会往左缩进的下半堵墙
    };
  });
  game.spikes = L.spikes.map(function (s) {
    return {
      x: s.x, y: s.y, w: s.w, h: s.h, hidden: !!s.hidden,
      triggerX: s.triggerX || 0, dir: s.dir || 'up',
      fake: !!s.fake,           // 假刺：长得一模一样，但不致命
      keepSafe: !!s.keepSafe,   // 反转后仍安全（2-5 的第二个刺）
      onPop: !!s.onPop,         // 等跳板把人弹起来之后才长出来
      moveTo: s.moveTo || null, // 触发后瞬移到这里（判定立刻过去，视觉上快速平移）
      atX: (s.atX === undefined ? null : s.atX),     // 横坐标触发
      fallOnly: !!s.fallOnly,                          // 只在人下落时才认横坐标触发
      atXlt: (s.atXlt === undefined ? null : s.atXlt), // 横坐标触发（小于）
      atY: (s.atY === undefined ? null : s.atY),     // 竖坐标触发
      needX: (s.needX === undefined ? null : s.needX), // 竖坐标触发还要求人已经过了这个 x
      atYlt: (s.atYlt === undefined ? null : s.atYlt), // 玩家在这一高度以上才触发（走下面不触发）
      onPlatY: (s.onPlatY === undefined ? null : s.onPlatY), // 只有站在 y≈这个值的平台上才触发
      moved: false, animT: 0, fromX: s.x, fromY: s.y,
      follow: !!s.follow, followDist: (s.followDist === undefined ? 200 : s.followDist),
      moveSpeed: (s.moveSpeed === undefined ? 2.6 : s.moveSpeed),
      shown: !s.hidden && !s.onPop, anim: (s.hidden || s.onPop) ? 0 : 1
    };
  });
  game.saws = (L.saws || []).map(function (s) {
    var tx = (s.tx === undefined) ? s.x : s.tx;
    var ty = (s.ty === undefined) ? s.y : s.ty;
    return {
      x0: s.x, y0: s.y, tx: tx, ty: ty,
      x: s.x, y: s.y, r: s.r || 20,
      speed: s.speed || 0,
      t: s.t0 || 0, dir: 1,                       // 沿路径的位置 0~1，来回
      rot: (s.t0 || 0) * 6,
      spin: (s.spin === undefined ? 3.4 : s.spin), // 自转角速度
      hidden: !!s.hidden,                         // 一开始藏着
      showOnPlatY: (s.showOnPlatY === undefined ? null : s.showOnPlatY), // 站上这个高度的平台才出现
      once: !!s.once,                             // 只滚一趟（不来回）
      chase: !!s.chase,                           // 跳过去后顿一下，然后快速追过来
      chaseDelay: (s.chaseDelay === undefined ? 0.55 : s.chaseDelay),  // 停顿时长
      chaseSpeed: (s.chaseSpeed === undefined ? 430 : s.chaseSpeed),   // 追的速度
      chasing: false, chaseT: 0, triggered: false,
      shown: !s.hidden, done: false
    };
  });
  game.reverse = L.reverse ? -1 : 1;         // 反向关：一开始就是反的
  game.flipOnLand = !!L.flipOnLand;          // 每次落地再反一次
  game.wasOnGround = false;
  game.goalReveal = (L.fakeGoal || L.goalHidden) ? 0 : 1;   // 真门的显现进度
  game.goalX = L.goal.x;                                    // 会走的门：当前 x
  game.goalDone = false; game.goalMoving = false;
  game.buttonPressed = false;                // 按钮是否按下
  game.wallAngle = 90;                       // 墙初始【竖直】(90°)；按按钮后匀速转起来
  game.wallOn = false;                       // 墙是否开始旋转
  game.fakeGoalDead = false;                 // 假门是否已失效（按下按钮后）
  game.fakeGoalShown = !!(L.fakeGoal && !L.fakeGoal.hidden);  // 假门一开始就在（除非显式 hidden）
  game.newWallDone = false; game.newWallT = 0; game.newWallRect = null;
  game.reversed = false;   // 2-5：按下按钮后世界规则反转（刺危险/地板安全）
  game.keyReveal = false;  // 3-3：左墙缩进后，隐藏的钥匙才显现
  game.buttonVisible = !(L.button && L.button.hidden);  // 默认显示；hidden 的按钮(2-5)等平台出现才显示
  game.wallSweep = 0;
  if (typeof location !== 'undefined' && location.search.indexOf('wa=') >= 0) {
    game.wallAngle = parseInt(location.search.split('wa=')[1]) || 0; game.wallOn = true; game.buttonPressed = true;
  }
  game.revealStarted = false;
  game.balls = (L.balls || []).map(function (b) {
    return {
      x: b.x, y: (b.y === undefined ? (b.fromBottom ? 436 : 100) : b.y), r: b.r || 34,   // 最高点统一 100
      bounceH: (b.bounceH === undefined ? 110 : b.bounceH),
      noHoming: !!b.noHoming,               // 永不追踪（只做普通弹跳）
      toPlatform: !!b.toPlatform,           // 触发后变成可站立的半圆平台
      asPlatform: false,
      vy: (b.vy !== undefined) ? b.vy : (b.fromBottom ? -Math.sqrt(2 * GRAVITY * 0.32 * 336) : 0),   // 从下往上：同样的弹起能量
      vx: 0, bounce: 0, maxBounce: b.bounces || 3,
      speed: b.speed || 300, homing: false, spin: 0,
      delay: b.chaseDelay === undefined ? 1.4 : b.chaseDelay    // 弹够之后还要等这么久才追

    };
  });
  game.timeLimit = L.timeLimit || 0;         // 限时（秒），到点所有球开始追你
  game.timeLeft = game.timeLimit;
  game.coins = (L.coins || []).map(function (c) {
    return { x: c.x, y: c.y, fake: !!c.fake, flip: !!c.flip, got: false, t: Math.random() * 6 };
  });
  game.flipT = -1;                    // >=0 表示翻转动画进行中
  game.sinkPhase = 'idle'; game.sinkT = 0; game.sinkY = 0; game.sinkLock = false;   // 门下沉
  game.goalDead = false;                                                            // 门是否已失效
  game.shrinkX = 0;                                          // 地板左缘右移量
  game.jumpLock = 0;
  game.popFired = false;      // 弹起后短暂禁止跳跃，免得被普通跳跃覆盖
  game.quakePhase = 'idle'; game.quakeT = 0; game.quakeOff = 0;   // 抖动 → 全塌
  game.keyThisLife = false;          // 这一命有没有捡到钥匙
  game.keyGetT = 999;                // 拿到钥匙之后过了多久（决定是不是"献祭"）
  game.keys = (L.keys || []).map(function (k) {
    return {
      x: k.x, y: k.y, got: false, t: 0,
      show: k.show || 0,                   // 出场动画进度 0~1
      hidden: !!k.hidden,                  // 一开始收着
      revealOnly: !!k.revealOnly,          // 只靠 keyReveal 显现（3-3）
      triggerX: k.triggerX || 0,           // 玩家走过这里才开始浮现
      outT: k.outT || 1.1,                 // 浮现用多久
      fx: (k.from === undefined ? k.x : k.from[0]),   // 从哪浮现（默认原地）
      fy: (k.from === undefined ? k.y : k.from[1]),
      slideToX: (k.slideTo === undefined ? null : k.slideTo),   // 一路滑到这儿
      slideT: 0, slideTime: k.slideTime || 2.6, gone: false,
      armX: (k.armX === undefined ? null : k.armX),             // 检查点一：先得到过这儿
      armed: false, started: false,                             // 检查点二：再回到 triggerX 左边才启动
      drop: !!k.drop, dropY: (k.dropY === undefined ? null : k.dropY),  // 从天掉下来
      onPlatY: (k.onPlatY === undefined ? null : k.onPlatY), started: false  // 站上这个高度的平台才掉
    };
  });
  game.arrows = L.arrows || [];
  game.cam = 0;
  game.particles = [];
  game.shake = 0;
  game.state = 'play';
  game.timer = 0;
  game.tauntT = 0;
  game.coyote = 0;
}

/* kind: 'boom'（默认，爆尸体）| 'fall'（掉坑，不爆） */
function die(kind) {
  if (game.state !== 'play') return;
  game.state = 'dead';
  game.timer = 0;
  game.deaths++;
  game.totalDeaths++;
  save.deaths++;               // 总死亡次数进存档（选关界面那只小幽灵看的就是它）
  writeSave();
  // 死人话：
  //   普通死 → 黄色，语气轻一点，别那么惊悚
  //   献祭死 → 血红。判定不是"拿过钥匙就死"，而是"死的时候正在钥匙旁边"
  //            （也就是真的为了拿它才死的）
  // 判定：拿到钥匙之后 2.6 秒内就死了 —— 也就是"拿完就没命了"。
  // 拿完钥匙跑很远才死的不算，那是自己作死，不是献祭。
  var sacrificed = game.keyThisLife && game.keyGetT < 2.6;
  if (sacrificed) {
    game.taunt = (LEVELS[game.li].sacrificeTaunt || '你献祭了自己，这是你应得的');
    game.tauntColor = '#c0392b';
    game.shake = 20;                    // 献祭额外震一下
  } else {
    game.taunt = TAUNTS[(Math.random() * TAUNTS.length) | 0];
    game.tauntColor = PAL.player;       // 黄色，轻一点
  }
  game.tauntT = 1.4;
  game.shake = 14;
  Sound.sfxDeath();                      // 统一用原版死亡音效
  // 掉坑：不爆尸体，就是人没了（约定：除了掉坑，其它死法都爆尸体）
  if (kind === 'fall') return;

  // 死亡粒子：全用火柴人自己那套黄，亮的那几颗当溅出来的尸块。
  var DEBRIS = ['#9c7a1e', '#b8901f', '#c9a02b', '#d8b02f', '#e8bb35', '#ffd23f', '#fff0a8'];
  var p = game.p;
  for (var i = 0; i < 32; i++) {
    game.particles.push({
      x: p.x + p.w / 2, y: p.y + p.h / 2,
      vx: (Math.random() - 0.5) * 380,
      vy: (Math.random() - 0.95) * 400,
      life: 0.8 + Math.random() * 0.6, max: 1,
      c: DEBRIS[(Math.random() * DEBRIS.length) | 0]
    });
  }
}

function winLevel() {
  if (game.state !== 'play') return;
  Sound.sfxWin();
  markCleared(CUR.w, CUR.i);       // 记进存档
  // 记下过关门动画的起点：门中心 + 玩家当前位置
  var g = LEVELS[game.li].goal;
  var gx = (game.goalX !== undefined) ? game.goalX : g.x;   // 会走的门：用当前真实位置
  game.winDoor = { k: 1, cx: gx + g.w / 2, cy: g.y + g.h / 2 };
  game.winFrom = { x: game.p.x, y: game.p.y };
  if (CUR.w === 3 && CUR.i === LEVELS_PER_WORLD - 1) {
    game.state = 'complete';
    Sound.sfxAllClear();
    return;
  }
  game.state = 'win';
  game.timer = 0;
}

/* ---------------- 输入 ----------------
   用「动作名」记录按键，并且优先读 e.code（物理键位）。
   这样能绕开中文输入法、大小写、键盘布局导致的丢键，
   也能保证「按住跳跃 + 同时按方向键」两者都生效、不互相打架。 */
var keys = {};
var ACT = {
  Space: 'jump', ArrowUp: 'jump', KeyW: 'jump',
  ArrowLeft: 'left', KeyA: 'left',
  ArrowRight: 'right', KeyD: 'right',
  ArrowDown: 'down', KeyS: 'down',
  KeyR: 'restart', KeyM: 'music', KeyN: 'skip', Enter: 'enter'
};
function keyAction(e) {
  if (e.code && ACT[e.code]) return ACT[e.code];
  var k = (e.key || '').toLowerCase();
  if (k === ' ' || k === 'spacebar') return 'jump';
  if (k === 'arrowup' || k === 'w') return 'jump';
  if (k === 'arrowleft' || k === 'a') return 'left';
  if (k === 'arrowright' || k === 'd') return 'right';
  if (k === 'arrowdown' || k === 's') return 'down';
  if (k === 'r') return 'restart';
  if (k === 'm') return 'music';
  if (k === 'n') return 'skip';
  if (k === 'enter') return 'enter';
  return null;
}
function startGame() {
  game.deaths = 0; game.totalDeaths = 0;
  Sound.startBgm();
  game.state = 'world';
  game.cursorW = 0;
}

/* 从第二级选关界面进入某一关 */
function loadSlot(w, i) {
  CUR.w = w; CUR.i = i;
  applyWorldPalette(w);          // 关卡内的配色跟着大关走
  game.deaths = 0;
  game.taunt = ''; game.tauntT = 0;
  Sound.startBgm();
  loadLevel(slotToLevelIndex(w, i));
}

/* 调试：直接通关当前关（关卡内容还没做） */
function debugClearCurrent() {
  if (game.state !== 'play') return;
  markCleared(CUR.w, CUR.i);
  game.state = 'levels';
  game.levelsWorld = CUR.w;
  game.cursorL = Math.min(LEVELS_PER_WORLD - 1, CUR.i + 1);
  Sound.sfxWin();
  game.flash = '通关 ' + (CUR.w + 1) + '-' + (CUR.i + 1);
  game.tauntT = 1.4;
}

function skipLevel() {
  game.deaths = 0;
  game.state = 'levels';
  game.levelsWorld = CUR.w;
  game.cursorL = Math.min(LEVELS_PER_WORLD - 1, CUR.i + 1);
}
function flashMsg(s) { game.flash = s; game.tauntT = 1.4; }

/* 两级界面的元素位置（画和点都用它） */
var DOOR_POS  = [ {x:158,y:352}, {x:408,y:246}, {x:652,y:342}, {x:822,y:184} ];
var LEVEL_POS = [ {x:150,y:342}, {x:302,y:258}, {x:462,y:322}, {x:640,y:244}, {x:806,y:310} ];

window.addEventListener('keydown', function (e) {
  if (e.isComposing || e.keyCode === 229) return;        // 输入法组字中，忽略

  /* 死亡后：按任意键继续（留 0.35s 缓冲，免得死亡瞬间手还按着键就跳过了） */
  if (game.state === 'dead') {
    if (game.timer > 0.35) { e.preventDefault(); game.deaths = 0; loadSlot(CUR.w, CUR.i); }
    return;
  }

  /* ---- 调试键必须先判 ----
     B / C 在 keyAction 里没有对应的动作名，如果放在下面，
     会被 `if (!a) return` 直接拦掉（A 之所以好使，是因为它映射成了 left）。 */
  if (e.code === 'KeyN' && game.state === 'play') {
    e.preventDefault(); debugClearCurrent(); return;
  }
  if (game.state !== 'play') {
    if (e.code === 'KeyA') { e.preventDefault(); giveKey(0); flashMsg('🔑 获得钥匙 · 脚下不稳'); return; }
    if (e.code === 'KeyB') { e.preventDefault(); giveKey(1); flashMsg('🔑 获得钥匙 · 眼见为虚'); return; }
    if (e.code === 'KeyC') { e.preventDefault(); giveKey(2); flashMsg('🔑 获得钥匙 · 机关重重'); return; }
  }

  var a = keyAction(e);
  if (!a) return;
  e.preventDefault();
  if (!keys[a] && a === 'jump') jumpPressed = true;
  keys[a] = true;
  Sound.init();
  if (Sound.ac && Sound.ac.state === 'suspended') Sound.ac.resume();

  if (game.state === 'world') {
    if (a === 'left' || a === 'up')    { game.cursorW = (game.cursorW + 3) % 4; return; }
    if (a === 'right' || a === 'down') { game.cursorW = (game.cursorW + 1) % 4; return; }
    if (a === 'jump' || a === 'enter') { enterWorld(game.cursorW); return; }
    return;
  }
  if (game.state === 'levels') {
    if (a === 'left' || a === 'up')    { game.cursorL = (game.cursorL + 4) % 5; return; }
    if (a === 'right' || a === 'down') { game.cursorL = (game.cursorL + 1) % 5; return; }
    if (a === 'restart') { game.state = 'world'; return; }          // R 回第一级
    if (a === 'jump' || a === 'enter') { enterLevel(game.levelsWorld, game.cursorL); return; }
    return;
  }

  if ((game.state === 'title' || game.state === 'complete') && (a === 'jump' || a === 'enter')) startGame();
  else if (a === 'music') Sound.toggle();
  else if (a === 'restart' && game.state === 'play') loadSlot(CUR.w, CUR.i);
  else if (a === 'skip' && game.state === 'play' && game.deaths >= 8) skipLevel();
});

function enterWorld(w) {
  if (!worldUnlocked(w)) {
    flashMsg(w === 3 ? '🔒 这扇门打不开' : '🔒 还没有路通到这里');
    return;
  }
  game.levelsWorld = w;
  game.cursorL = 0;
  for (var i = 0; i < LEVELS_PER_WORLD; i++) if (!isCleared(w, i)) { game.cursorL = i; break; }
  game.state = 'levels';
  Sound.sfxWin();
}
function enterLevel(w, i) {
  if (!levelUnlocked(w, i)) { flashMsg('🔒 先过了上一关'); return; }
  // 进关卡：红门合上 → 停顿 → 打开，开门时露出的已经是关卡
  startTransition(function () { loadSlot(w, i); });
}
window.addEventListener('keyup', function (e) {
  var a = keyAction(e);
  if (a) keys[a] = false;
});
window.addEventListener('blur', function () { keys = {}; });  // 切走窗口清键，防止"卡住一直跑/一直跳"
canvas.addEventListener('mousedown', function (e) {
  Sound.init();
  if (Sound.ac && Sound.ac.state === 'suspended') Sound.ac.resume();
  var pt = canvasPoint(e);

  if (game.state === 'title') {
    // 只有点到那个播放按钮才开始 —— 点屏幕别处不算
    if (pointInStartButton(e)) startGame();
  } else if (game.state === 'complete') {
    if (pointInStartButton(e)) startGame();
  } else if (game.state === 'world') {
    for (var i = 0; i < 4; i++) {
      var d = DOOR_POS[i];
      if (Math.abs(pt.x - d.x) < 48 && Math.abs(pt.y - d.y) < 56) {
        game.cursorW = i; enterWorld(i); return;
      }
    }
  } else if (game.state === 'levels') {
    if (pt.x >= VW-134 && pt.x <= VW-40 && pt.y >= 26 && pt.y <= 64) { game.state = 'world'; return; }
    for (var j = 0; j < LEVELS_PER_WORLD; j++) {
      var n = LEVEL_POS[j];
      if (Math.hypot(pt.x - n.x, pt.y - n.y) < 36) {
        game.cursorL = j; enterLevel(game.levelsWorld, j); return;
      }
    }
  } else if (game.state === 'dead') {
    if (game.timer > 0.35) { game.deaths = 0; loadSlot(CUR.w, CUR.i); }
  } else {
    jumpPressed = true;
  }
});
canvas.addEventListener('mousemove', function (e) { game.mouse = canvasPoint(e); });
canvas.addEventListener('mouseleave', function () { game.mouse = null; });

function canvasPoint(e) {
  var r = canvas.getBoundingClientRect();
  return {
    x: (e.clientX - r.left) * (VW / r.width),
    y: (e.clientY - r.top) * (VH / r.height)
  };
}
function pointInStartButton(e) {
  var p = canvasPoint(e), b = START_BTN;
  return p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
}
function mouseOnStartButton() {
  var m = game.mouse, b = START_BTN;
  return !!m && m.x >= b.x && m.x <= b.x + b.w && m.y >= b.y && m.y <= b.y + b.h;
}
var jumpPressed = false;

/* ---------------- 物理与更新 ---------------- */
function aabb(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update(dt) {
  // 过场动画期间冻结一切，只推进门
  if (TRANS.on) { updateTransition(dt); return; }

  var p = game.p;

  // 粒子
  for (var i = game.particles.length - 1; i >= 0; i--) {
    var q = game.particles[i];
    q.vy += 1500 * dt;
    q.x += q.vx * dt; q.y += q.vy * dt;
    q.life -= dt;
    if (q.life <= 0) game.particles.splice(i, 1);
  }
  if (game.shake > 0) game.shake = Math.max(0, game.shake - 60 * dt);
  if (game.tauntT > 0) game.tauntT -= dt;

  if (game.state === 'dead') {
    game.timer += dt;      // 不再自动重开 —— 等玩家按任意键
    return;
  }
  if (game.state === 'win') {
    game.timer += dt;
    var tw = game.timer, wd = game.winDoor, pw = game.p;
    if (wd) {
      // 第一段：把人吸到门洞正中间（smoothstep，不是线性，看着更"被吸"）
      var k1 = Math.min(1, tw / 0.15);
      k1 = k1 * k1 * (3 - 2 * k1);
      pw.x = game.winFrom.x + (wd.cx - pw.w / 2 - game.winFrom.x) * k1;
      pw.y = game.winFrom.y + (wd.cy - pw.h / 2 - game.winFrom.y) * k1;
      // 第二段：门快速收窄成一条线，人也跟着被压进去
      wd.k = Math.max(0, 1 - Math.max(0, (tw - 0.15) / 0.26));
    }
    if (tw > 0.62 && !TRANS.on) {
      // 出关卡：同样一次过场，开门时露出的已经是选关界面
      startTransition(function () {
        game.state = 'levels';
        game.levelsWorld = CUR.w;
        game.cursorL = Math.min(LEVELS_PER_WORLD - 1, CUR.i + 1);
      });
    }
    return;
  }
  if (game.state !== 'play') return;

  // 陷阱触发：突然出现的平台 / 地下钻出的活塞 / 隐藏尖刺
  for (var j = 0; j < game.plats.length; j++) {
    var pl = game.plats[j];

    // --- 活塞：从地下钻出 → 一路把人往前顶 → 到坑沿再缩回地下 ---
    if (pl.kind === 'piston') {
      if (pl.phase === 'hidden') {
        if (p.x + p.w > pl.triggerX) {
          pl.phase = 'rising'; pl.phaseT = 0; pl.state = 'active';
          Sound.sfxTrap(); game.shake = 5;
        }
      } else if (pl.phase === 'rising') {
        pl.phaseT += dt;
        var kr = Math.min(1, pl.phaseT / PISTON_RISE);
        pl.y = pl.baseY + pl.h * (1 - kr);           // 从地下升到地面
        if (kr >= 1) { pl.phase = 'moving'; pl.phaseT = 0; }
      } else if (pl.phase === 'moving') {
        pl.x += pl.moveV * dt;
        // 推着玩家走（moveV 为负就一路往左推）
        if (aabb(p, pl)) p.x = pl.moveV > 0 ? pl.x + pl.w : pl.x - p.w;
        var reached = pl.moveV > 0 ? (pl.x >= pl.moveTo) : (pl.x <= pl.moveTo);
        if (pl.moveTo && reached) { pl.phase = 'sinking'; pl.phaseT = 0; }
      } else if (pl.phase === 'sinking') {
        pl.phaseT += dt;
        var ks = Math.min(1, pl.phaseT / PISTON_SINK);
        pl.y = pl.baseY + pl.h * ks;                 // 完全缩回地下，一点不留
        if (ks >= 1) { pl.phase = 'gone'; pl.state = 'gone'; }
      }
      continue;
    }

    // --- 升起的墙（riseWall）：玩家跳到半空时触发，升起来挡路，1.5 秒后缩回 ---
    if (pl.kind === 'riseWall') {
      if (pl.risePhase === 'idle' && !p.onGround && p.x + p.w > pl.x - 60 && p.x < pl.x + pl.w + 60) {
        pl.risePhase = 'rising'; pl.riseT = 0; Sound.sfxTrap(); game.shake = 6;
      }
      if (pl.risePhase === 'rising') {
        pl.riseT += dt;
        pl.riseY = Math.min(1, pl.riseT / 0.15);         // 0.15 秒升起来（快得来不及站墙头）
        if (pl.riseY >= 1) { pl.risePhase = 'holding'; pl.riseT = 0; }
      } else if (pl.risePhase === 'holding') {
        pl.riseT += dt;
        if (pl.riseT >= 1.5) { pl.risePhase = 'sinking'; pl.riseT = 0; }   // 停 1.5 秒
      } else if (pl.risePhase === 'sinking') {
        pl.riseT += dt;
        pl.riseY = Math.max(0, 1 - pl.riseT / 0.3);      // 0.3 秒缩回去
        if (pl.riseY <= 0) { pl.risePhase = 'done'; }   // 只升起一次，缩回后不再触发
      }
      continue;
    }

    if (pl.kind === 'appear' && pl.state === 'hidden' && p.onGround && p.x + p.w > pl.triggerX && p.x < pl.triggerX + 140) {
      pl.state = 'active'; pl.appeared = 0.18;   // 从空气里长出来
      game.buttonVisible = true;                // 按钮跟着平台一起出现
      Sound.sfxTrap(); game.shake = 5;
    }
    if (pl.appeared > 0) pl.appeared -= dt;
    // 会走的障碍：出现后自己往前推。玩家被它堵住时，
    // 水平碰撞会把玩家按在它身前，于是"被推着走"。
    if (pl.moveV && pl.state === 'active') {
      pl.x += pl.moveV * dt;
      if (pl.moveTo && pl.x >= pl.moveTo) pl.state = 'gone';
      if (aabb(p, pl)) {
        p.x = pl.moveV > 0 ? pl.x + pl.w : pl.x - p.w;
      }
    }
  }
  for (var k = 0; k < game.spikes.length; k++) {
    var sp = game.spikes[k];
    if (sp.onPop) continue;                    // onPop 的刺由 popFired 单独管，别在这里抢
    if (!sp.shown) {
      var reveal = false;
      if (sp.onPlatY !== null) reveal = !!(p.ground && Math.abs(p.ground.y - sp.onPlatY) < 6);  // 站在二楼平台上才露头
      else if (sp.atXlt !== null) reveal = (p.x + p.w / 2 < sp.atXlt);   // 玩家往左走到某点才露头
      else if (sp.atYlt !== null) reveal = (p.y < sp.atYlt);      // 只有上到高处才露头
      else reveal = (p.x + p.w > sp.triggerX);
      if (reveal) { sp.shown = true; Sound.sfxTrap(); game.shake = 5; }
    }
    if (sp.shown && sp.anim < 1) sp.anim = Math.min(1, sp.anim + dt * 7);

    // 瞬移：判定立刻到新位置，视觉上从旧位置快速平移过去
    if (!sp.moved && (sp.moveTo || sp.follow)) {
      var air = !p.onGround;
      var fire = (sp.atX !== null && p.x + p.w / 2 > sp.atX && (!sp.fallOnly || air)) ||
                 (sp.atXlt !== null && p.x + p.w / 2 < sp.atXlt) ||
                 (sp.atY !== null && p.y > sp.atY && (sp.needX === null || p.x + p.w / 2 > sp.needX)) ||
                 (sp.atYlt !== null && p.y < sp.atYlt);
      if (fire) {
        sp.moved = true;
        sp.fromX = sp.x; sp.fromY = sp.y;          // 起点
        if (sp.follow) {
          sp.targetX = p.x + sp.followDist;        // 目标：追到玩家落点
          sp.targetY = sp.y;
        } else {
          sp.targetX = sp.moveTo[0]; sp.targetY = sp.moveTo[1];
        }
        sp.animT = 0; sp.shown = true; sp.anim = 1;
        Sound.sfxTrap(); game.shake = Math.max(game.shake, 6);
      }
    }
    // 判定和动画一起动：位置每帧从起点插值到目标，碰撞用的就是当前位置
    if (sp.moved && sp.animT < 1) {
      sp.animT = Math.min(1, sp.animT + dt * sp.moveSpeed);            // 默认 2.6 ≈ 0.38s
      var ee = sp.animT * sp.animT * (3 - 2 * sp.animT);               // smoothstep
      sp.x = sp.fromX + (sp.targetX - sp.fromX) * ee;
      sp.y = sp.fromY + (sp.targetY - sp.fromY) * ee;
    }
  }

  // 水平输入（反向关：整体乘以 game.reverse，+1 正常 / -1 反向）
  var left = keys['left'];
  var right = keys['right'];
  p.vx = 0;
  var dirK = game.reverse || 1;
  if (left)  { p.vx = -MOVE * dirK; p.face = -1 * dirK; }
  if (right) { p.vx =  MOVE * dirK; p.face =  1 * dirK; }

  // 跳跃（土狼时间 + 输入缓冲 0.12s + 按住连跳）
  // 跳跃力是「每关」的：关卡数据里的 jump 覆盖默认值。
  // 这本身就是一种关卡设计手段 —— 跳得矮 = 容错小 = 能初见杀；
  // 反过来调高还能做"跳太高反而撞上天花板尖刺"的坑。
  var jumpV = LEVELS[game.li].jump || JUMP_V;
  var wantJump = keys['jump'];
  if (p.onGround) game.coyote = 0.1; else game.coyote = Math.max(0, game.coyote - dt);
  if (jumpPressed) game.jumpBuf = 0.12; else game.jumpBuf = Math.max(0, game.jumpBuf - dt);
  if (wantJump) game.jumpBuf = Math.max(game.jumpBuf, 0.08);
  if (game.jumpLock > 0) { game.jumpLock -= dt; game.jumpBuf = 0; game.coyote = 0; }
  if (game.jumpLock <= 0 && game.jumpBuf > 0 && game.coyote > 0) {
    p.vy = -jumpV; p.onGround = false; game.coyote = 0; game.jumpBuf = 0; p.sq = 0.72;
    Sound.sfxJump();
  }
  jumpPressed = false;
  // 短按小跳：松开跳跃键时截断上升（约按住时的 45% 高）
  var hopV = jumpV * 0.63;
  if (game.jumpLock <= 0 && p.vy < -hopV && !wantJump) p.vy = -hopV;   // 跳板弹起时不许被"松手"截断

  // 水平移动 + 碰撞（单向薄平台不参与，避免跳跃时被平台边缘卡死）
  p.x += p.vx * dt;
  for (var m = 0; m < game.plats.length; m++) {
    var a = game.plats[m];
    if (a.state !== 'active' || a.oneWay || a.noCollide) continue;
    if (a.kind === 'flip' && game.flipT >= 0) continue;      // 翻板过程中不挡路
    if (a.kind === 'riseWall') {
      var rwH4 = a.h * a.riseY;
      if (rwH4 <= 1) continue;
      var rwb4 = { x: a.x, y: a.y - rwH4, w: a.w, h: rwH4 };
      if (aabb(p, rwb4)) {
        if (p.vx > 0) p.x = rwb4.x - p.w;      // 像硬墙一样：从左边推回
        else if (p.vx < 0) p.x = rwb4.x + rwb4.w;
      }
      continue;
    }
    if (aabb(p, a)) {
      if (p.vx > 0) p.x = a.x - p.w;
      else if (p.vx < 0) p.x = a.x + a.w;
    }
  }

  // 垂直移动 + 碰撞（变平台的球：球顶当半圆平台站）
  var prevBottom = p.y + p.h;               // 移动前的脚底位置
  p.vy = Math.min(MAX_FALL, p.vy + GRAVITY * dt);
  p.y += p.vy * dt;
  p.onGround = false; p.ground = null;
  for (var n = 0; n < game.plats.length; n++) {
    var b = game.plats[n];
    if (b.state !== 'active' || b.noCollide) continue;       // noCollide = 已经"变成坑"了
    if (b.kind === 'flip' && game.flipT >= 0) continue;      // 翻板过程中站不住
    // 变成平台的球：球顶当半圆平台站
    if (b.kind === 'riseWall') {
      // 升起的墙：实体碰撞盒随 riseY 变高（从地面往上顶，跳不过去）
      var rwH = b.h * b.riseY;
      if (rwH <= 1) continue;
      var rwb = { x: b.x, y: b.y - rwH, w: b.w, h: rwH };
      if (aabb(p, rwb)) {
        if (p.vy > 0 && prevBottom <= rwb.y + 8) { p.y = rwb.y - p.h; p.onGround = true; p.ground = b; p.vy = 0; }
        else if (p.vy < 0) { p.y = rwb.y + rwb.h; p.vy = 0; }   // 顶头
      }
      continue;
    }
    if (aabb(p, b)) {
      if (p.vy > 0 && prevBottom <= b.y + 8) {
        // 只有从上方落下来才站得住
        p.y = b.y - p.h; p.onGround = true; p.ground = b;
        if (p.vy > 240) p.sq = 0.78;
        p.vy = 0;
      } else if (!b.oneWay && p.vy < 0) {
        // 实心平台的底面可以顶头（墙就是靠这个挡住你的）
        p.y = b.y + b.h; p.vy = 0;
      }
    }
  }

  // 变平台的球：球顶当半圆平台站（3-4）
  for (var bp2 = 0; bp2 < game.balls.length; bp2++) {
    var blp = game.balls[bp2];
    if (!blp.asPlatform) continue;
    var capY = blp.y - blp.r;
    if (p.x + p.w > blp.x - blp.r && p.x < blp.x + blp.r &&
        p.vy >= 0 && prevBottom <= capY + 10 && p.y + p.h >= capY && p.y + p.h <= capY + 26) {
      p.y = capY - p.h; p.vy = 0; p.onGround = true; p.ground = null;
    }
  }

  // ===== 墙本体碰撞：墙转到哪，碰撞就在哪 =====
  //   静止时是"挡路的墙"（水平推出），转动过程中扫到人就压死。
  if (LEVELS[game.li].wall && !game.wallOn) {
    // 墙没转之前是实体挡路；一旦开始转，身体让开（压死交给转完那一刻判定）
    var wbs = wallBlocks();
    var hitWall = false;
    for (var wb = 0; wb < wbs.length; wb++) { if (aabb(p, wbs[wb])) { hitWall = true; break; } }
    if (hitWall) {
      if (game.wallOn) { die(); return; }      // 墙在转 → 碰到就被压死
      // 没转的墙：只挡路（水平推出）
      for (var wb2 = 0; wb2 < wbs.length; wb2++) {
        var blk = wbs[wb2];
        if (aabb(p, blk)) {
          if (p.x + p.w / 2 > blk.x + blk.w / 2) p.x = blk.x + blk.w;
          else p.x = blk.x - p.w;
          p.vx = 0;
        }
      }
    }
  }

  // 假地板：踩上只撑 0.12 秒 —— 走是绝对走不过去的，踩上去就得往下掉
  // 会塌的板（假地板 / 消失板）：行为完全统一 ——
  // 踩上去「立刻」开始往左缩进去，左缘钉死、宽度收到 0。
  // 外观也和普通平台一模一样，不给任何提前剧透。
  for (var t = 0; t < game.plats.length; t++) {
    var c = game.plats[t];
    if (c.state !== 'active') continue;

    // feint（假动作）：踩上去先往里缩一截吓你一下，然后原样弹回来，根本不塌
    if (c.kind === 'feint') {
      if (c.feinting === undefined) { c.feinting = false; c.feintDone = false; }
      // 人走了也照样缩完 —— 只有「没在动的」时候离开才复位
      if (p.ground !== c && !c.feinting) { c.feintDone = false; c.w = c.w0; continue; }
      if (!c.feinting && !c.feintDone) { c.feinting = true; c.feintDone = true; c.feintT = 0; Sound.sfxTrap(); }
      if (c.feinting) {
        c.feintT += dt;
        var fk;
        if (c.feintT < 0.09) fk = (c.feintT / 0.09) * 0.55;                 // 猛地缩进去（一半以上）
        else if (c.feintT < 0.34) fk = 0.55;                                // 卡住一小会儿
        else if (c.feintT < 0.62) fk = 0.55 * (1 - (c.feintT - 0.34) / 0.28); // 慢慢弹回来
        else { fk = 0; c.feinting = false; }
        c.w = c.w0 * (1 - fk);
      }
      continue;
    }
    if ((c.kind === 'fake' || c.kind === 'vanish') && c.retract === undefined) {
      if (p.ground === c) { c.retract = 0; Sound.sfxTrap(); }        // 踩上就缩
      else if (c.triggerX && p.x + p.w / 2 > c.triggerX) { c.retract = 0; Sound.sfxTrap(); }  // 或走到触发点就缩
    }
    if (c.retract !== undefined) {
      c.retract += dt;
      var rk = Math.min(1, c.retract / (c.retractT || 0.20));
      c.w = Math.max(0, c.w0 * (1 - rk));
      if (rk >= 1) { c.state = 'gone'; puff(c.x, c.y); }
    }
  }

  // 挤压回弹
  p.sq += (1 - p.sq) * Math.min(1, dt * 12);

  // 火柴人的动画状态：走 / 跳 / 落 / 停
  p.anim += dt;
  if (!p.onGround) p.animState = (p.vy < 0) ? 'jump' : 'fall';
  else if (Math.abs(p.vx) > 1) p.animState = 'walk';
  else p.animState = 'idle';

  // 锯片：沿路径来回滚 + 自转，碰到就死（圆形判定，比尖刺更"软"一点）
  var pcx = p.x + p.w / 2, pcy = p.y + p.h / 2;
  for (var w2 = 0; w2 < game.saws.length; w2++) {
    var sw = game.saws[w2];
    sw.rot += sw.spin * dt;
    // 藏着的锯片：等你站上指定高度的平台才现身（伴随震屏）
    if (!sw.shown && sw.showOnPlatY !== null) {
      if (p.ground && Math.abs(p.ground.y - sw.showOnPlatY) < 6) {
        sw.shown = true; game.shake = 14; Sound.sfxTrap();
      }
    }
    if (!sw.shown) continue;                    // 没现身：不画不判定
    // 玩家跳过锯片（越过它）→ 触发"顿一下再快速追"
    if (sw.chase && !sw.triggered && p.x > sw.x + sw.r) {
      sw.triggered = true; sw.chasing = true; sw.chaseT = 0; Sound.sfxTrap();
    }
    if (sw.chasing) {
      sw.chaseT += dt;
      if (sw.chaseT > sw.chaseDelay) {
        // 停顿结束：快速朝玩家冲过去
        var cdir = (p.x + p.w / 2 > sw.x) ? 1 : -1;
        sw.x += cdir * sw.chaseSpeed * dt;
        sw.y += (p.y + p.h / 2 - sw.y) * Math.min(1, dt * 8);   // 追的时候也贴向玩家高度
      }
    } else if (sw.speed > 0 && !sw.done) {
      var len = Math.sqrt((sw.tx - sw.x0) * (sw.tx - sw.x0) + (sw.ty - sw.y0) * (sw.ty - sw.y0)) || 1;
      sw.t += sw.dir * (sw.speed / len) * dt;
      if (sw.t >= 1) {
        sw.t = 1;
        if (sw.once) { sw.done = true; }
        else sw.dir = -1;
      }
      else if (sw.t <= 0) { sw.t = 0; sw.dir = 1; }
      sw.x = sw.x0 + (sw.tx - sw.x0) * sw.t;
      sw.y = sw.y0 + (sw.ty - sw.y0) * sw.t;
    }
    var ddx = pcx - sw.x, ddy = pcy - sw.y;
    if (Math.sqrt(ddx * ddx + ddy * ddy) < sw.r * 0.80 + 8) { die('saw'); return; }
  }

  // onPop 的刺：每帧强制跟 popFired 同步 —— 没被弹起来之前绝对不显示。
  // （之前只在"弹起那一刻"置 shown，结果初始化/重载路径上会被别的逻辑又点亮）
  for (var op = 0; op < game.spikes.length; op++) {
    var osp = game.spikes[op];
    if (!osp.onPop) continue;
    var should = !!game.popFired;
    if (should && !osp.shown) Sound.sfxTrap();
    osp.shown = should;
    osp.anim = should ? 1 : 0;
  }

  // 尖刺致死（假刺长得一样，但踩上去没事——这是骗人的）
  for (var s = 0; s < game.spikes.length; s++) {
    var sp2 = game.spikes[s];
    if (!sp2.shown) continue;
    // 反转后（2-5 按完按钮）：假刺变成真刺，只有 keepSafe 那簇还安全
    if (sp2.fake && !(game.reversed && !sp2.keepSafe)) continue;
    var box = spikeBox(sp2);
    if (aabb(p, box)) { die(); return; }
  }

  // 掉出地图
  if (p.y > VH + 120) { die('fall'); return; }

  game.keyGetT += dt;

  // ===== 门下沉：跳过去就跟着沉，够不着（死后动画自动停住，因为 dead 分支直接 return）=====
  var LV = LEVELS[game.li];
  // ===== 隐藏跳板：踩上去皮会伸起来，然后自动把人大力弹飞 =====
  for (var bp = 0; bp < game.plats.length; bp++) {
    var bt = game.plats[bp];
    if (bt.kind !== 'bounce') continue;
    // 位置检测：人压在跳板那一小块上就触发（不要求 p.ground 是它）
    // 只有"人真的站在这块板上"才触发：脚底贴着板面、水平有交集、不是往上飞
    var onIt = Math.abs((p.y + p.h) - bt.y) < 7 &&
               p.x + p.w > bt.x + 4 && p.x < bt.x + bt.w - 4 &&
               p.vy >= -20;
    if (!onIt) {
      bt.pop = Math.max(0, bt.pop - dt * 6);   // 离开就慢慢瘪回去
      if (bt.pop <= 0.02) bt.popped = false;   // 完全瘪回去才算复位，可以再弹
      continue;
    }
    {
      bt.pop = Math.min(1, bt.pop + dt / (bt.popTime || 0.10));
      // 只在「刚压到底」的那一帧弹一次 —— 否则每一帧都会重弹 + 重放音效
      if (bt.pop >= 1 && !bt.popped) {
        bt.popped = true;
        p.vy = -(bt.power || 1420);          // 自动起跳，不由玩家决定
        p.y = bt.y - p.h - 3;                // 抬出板子，免得下一帧又被判"顶头"
        p.onGround = false;
        game.jumpLock = 0.18;                // 锁一会儿，否则会被土狼时间里的普通跳跃覆盖掉
        game.popFired = true;                // 通知：人已经被弹起来了
        game.coyote = 0; game.jumpBuf = 0;
        Sound.sfxBounce();
      }
    }
  }

  // ===== 虚晃一枪：先抖一下骗你，然后所有平台秒变坑，只有门留在原地 =====
  if (LV.quake && game.quakePhase !== 'done') {
    var qk = LV.quake;
    if (game.quakePhase === 'idle' && p.x + p.w / 2 > qk.triggerX) {
      game.quakePhase = 'shake'; game.quakeT = 0; Sound.sfxTrap();
    }
    if (game.quakePhase === 'shake') {
      game.quakeT += dt;
      game.quakeOff = Math.sin(game.quakeT * 55) * 6;      // 只是抖，不塌 —— 骗你跳
      for (var qi = 0; qi < game.plats.length; qi++) {
        var qp = game.plats[qi];
        if (qp.kind === 'pitFloor') qp.y = qp.y0 + game.quakeOff;   // 只有原本要缩的那片在抖
      }
      if (game.quakeT > qk.shakeTime) {
        game.quakePhase = 'sinking'; game.quakeT = 0; Sound.sfxBoom();
      }
    } else if (game.quakePhase === 'sinking') {
      game.quakeT += dt;
      var qk2 = Math.min(1, game.quakeT / qk.sinkTime);
      game.quakeOff = 0;
      for (var qj = 0; qj < game.plats.length; qj++) {
        var qp2 = game.plats[qj];
        qp2.noCollide = true;                              // 秒变坑：碰撞立刻失效
        qp2.y = qp2.y0 + qk2 * 420;
        if (qk2 >= 1) { qp2.state = 'gone'; game.quakePhase = 'done'; }
      }
    }
  }
  if (LV.sinkGoal) {
    var sg = LV.sinkGoal;
    var depth = sg.depth === undefined ? 220 : sg.depth;
    var stime = sg.time || 0.30;
    // 只有"跳起来扑过去"才触发 —— 站着或走着不算。
    // 触发的那一刻门就"在代码上没了"：判定区立即失效、脚下变坑，
    // 视觉上再补一个快速落下的动画。
    if (game.sinkPhase === 'idle' && !game.sinkLock && !p.onGround &&
        p.x + p.w / 2 > sg.triggerX) {
      game.sinkPhase = 'sinking'; game.sinkT = 0;
      game.goalDead = true; Sound.sfxTrap();
    }
    // 升起之后上锁：玩家得先离开触发区，门才允许再被触发（避免反复升降）
    if (game.sinkLock && p.x + p.w / 2 < sg.triggerX - 90) game.sinkLock = false;
    if (game.sinkPhase === 'sinking') {
      game.sinkT += dt;
      game.sinkY = Math.min(1, game.sinkT / stime) * depth;
      if (game.sinkY >= depth - 0.5) { game.sinkPhase = 'down'; game.sinkT = 0; }
    } else if (game.sinkPhase === 'down') {
      game.sinkT += dt;
      if (game.sinkT > (sg.riseDelay === undefined ? 3 : sg.riseDelay)) { game.sinkPhase = 'rising'; game.sinkT = 0; }
    } else if (game.sinkPhase === 'rising') {
      game.sinkT += dt;
      game.sinkY = Math.max(0, (1 - Math.min(1, game.sinkT / stime)) * depth);
      if (game.sinkY <= 0.5) {
        game.sinkPhase = 'idle'; game.sinkY = 0; game.sinkLock = true;
        game.goalDead = false;               // 门长回来了，判定区跟着一起回来
      }
    }
    // 门下面的那块地板跟着一起沉
    for (var sfi = 0; sfi < game.plats.length; sfi++) {
      if (game.plats[sfi].kind === 'sinkFloor') game.plats[sfi].y = game.plats[sfi].y0 + game.sinkY;
    }
  }

  // ===== 前方那块地板"往下缩"变成坑 =====
  for (var pf = 0; pf < game.plats.length; pf++) {
    var fp2 = game.plats[pf];
    if (fp2.kind !== 'pitFloor' || fp2.sunk) continue;
    if (LV.quake) continue;                                 // 这一关交给 quake 剧本
    if (p.x + p.w / 2 > fp2.triggerX) {
      if (!fp2.sinking) { fp2.sinking = true; fp2.noCollide = true; Sound.sfxTrap(); }
      fp2.y += (fp2.h / fp2.sinkT2) * dt;                   // 整块往下沉（纯视觉）
      if (fp2.y > fp2.y0 + fp2.h * 1.7) { fp2.state = 'gone'; fp2.sunk = true; }
    }
  }

  // ===== 地板从左往右缩：左缘一路往右追你，跑到某个位置停，再让前方塌掉 =====
  if (LV.shrinkFloor) {
    var shf = LV.shrinkFloor;
    if (p.x + p.w / 2 > shf.triggerX) {
      if (game.shrinkX < (shf.stopX || 500)) {
        game.shrinkX = Math.min(shf.stopX || 500, game.shrinkX + shf.speed * dt);
      }
    }
    var fl0 = game.plats[0];
    fl0.x = fl0.x0 + game.shrinkX;
    fl0.w = fl0.w0 - game.shrinkX;
  }

  // 翻转平台：吃金币触发，整块板绕中心转 180°，转完就没了。
  // 转动期间碰撞失效 —— 所以人是"没地方站直接掉下去"。
  if (game.flipT >= 0 && game.flipT < 1) {
    game.flipT = Math.min(1, game.flipT + dt / 0.35);
    if (game.flipT >= 1) {
      for (var fp = 0; fp < game.plats.length; fp++) {
        if (game.plats[fp].kind === 'flip') game.plats[fp].state = 'gone';
      }
      puff(VW / 2, 470);
    }
  }

  // 反向关：每次落地 → 震一下 + 方向再次翻转（给玩家一个身体上的提示）
  if (game.flipOnLand && p.onGround && !game.wasOnGround) {
    game.reverse = -(game.reverse || 1);
    game.shake = Math.max(game.shake, 7);
    Sound.sfxTrap();
  }
  game.wasOnGround = p.onGround;

  // 限时：到点之后所有球开始追你
  if (game.timeLimit > 0) {
    game.timeLeft -= dt;
    if (game.timeLeft <= 0) for (var bi0 = 0; bi0 < game.balls.length; bi0++) game.balls[bi0].homing = true;
  }

  // 落球：先垂直弹几下，弹够次数（或者限时到）之后直接朝玩家飞过来
  for (var bi = 0; bi < game.balls.length; bi++) {
    var bl = game.balls[bi];
    bl.spin += dt * 6;
    if (bl.homing) {
      var bx = (p.x + p.w / 2) - bl.x, by = (p.y + p.h / 2) - bl.y;
      var bd = Math.sqrt(bx * bx + by * by) || 1;
      bl.x += bx / bd * bl.speed * dt;
      bl.y += by / bd * bl.speed * dt;
    } else {
      bl.vy = Math.min(900, bl.vy + GRAVITY * 0.32 * dt);   // 球的重力更小：掉得慢、弹得高
      bl.y += bl.vy * dt;
      // 落地反弹
      if (bl.y + bl.r > 470) {
        bl.y = 470 - bl.r;
        bl.vy = -Math.sqrt(2 * GRAVITY * 0.32 * 336);   // 固定弹起能量：所有球最高点一致(球心 y≈100)
        bl.bounce++;
        if (bl.bounce === 1) Sound.sfxTrap();
        if (!bl.noHoming && bl.bounce >= bl.maxBounce && !bl.armed) { bl.armed = true; bl.delay = (bl.delay === undefined ? 1.4 : bl.delay); }
      }
      if (bl.armed && !bl.homing) {
        bl.delay -= dt;
        if (bl.delay <= 0) bl.homing = true;
      }
    }
    if (Math.abs((p.x + p.w / 2) - bl.x) < bl.r + 9 && Math.abs((p.y + p.h / 2) - bl.y) < bl.r + 11) {
      die(); return;
    }
  }

  // 假终点：走到触发点开始计时，真门缓缓显形。
  // 计时长度是按"玩家从触发点走到假门的时间"配的，所以真门几乎在他撞上假门那刻才出现。
  var L6 = LEVELS[game.li];

  // ===== 3-4：穿过最后一个球 → 二楼按钮出现 + 那个球变成可站的半圆平台 =====
  if (L6.button && L6.button.revealAfterBall && !game.buttonVisible) {
    var lastBall = null;
    for (var lb = 0; lb < game.balls.length; lb++) if (game.balls[lb].toPlatform) lastBall = game.balls[lb];
    if (lastBall && p.x + p.w / 2 > lastBall.x) {
      game.buttonVisible = true;
      lastBall.asPlatform = true;
      Sound.sfxTrap(); game.shake = 8;
    }
  }

  // ===== 按钮：碰一下触发整条连锁 =====
  if (L6.button && !game.buttonPressed) {
    var bt = L6.button;
    if (p.x < bt.x + bt.w && p.x + p.w > bt.x && p.y < bt.y + bt.h && p.y + p.h > bt.y) {
      game.buttonPressed = true;
      game.wallOn = true;                 // 墙开始旋转（有墙的关才用）
      game.fakeGoalDead = true;           // 假门失效（碰了没反应）
      game.reversed = true;               // ★ 2-5：世界规则反转
      game.shake = 8;
      Sound.sfxTrap();
    }
  }

  // ===== 致命地面（2-5）：这关地面一踩就死，刺反而是安全的 =====
  if (p.ground && p.ground.deadly && !game.reversed) {
    // 地板上"有刺的那几段"是安全的，其余地方一踩就死
    // 反转前：所有刺下面都安全；反转后：只剩"第二个刺"(keepSafe)那一段安全
    var safeZones = LEVELS[game.li].safeZones || [];
    if (!game.reversed) {
      safeZones = game.spikes.filter(function (sp) { return sp.fake; })
        .map(function (sp) { return [sp.x, sp.x + sp.w + 15]; });
    }
    var cx = p.x + p.w / 2, isSafe = false;
    for (var szi = 0; szi < safeZones.length; szi++) {
      if (cx >= safeZones[szi][0] && cx <= safeZones[szi][1]) { isSafe = true; break; }
    }
    if (!isSafe) { die(); return; }
  }

  // ===== 墙：靠【转速】形成时间压力 =====
  //   转的这 2.2 秒就是你的逃生窗口：墙转到底那一刻，还留在墙下端右边的人直接被压死。
  //   拿钥匙要绕到假门头顶的平台，回来必然来不及 → 死
  //   立刻往左跑过墙下端 → 活
  if (L6.wall && game.wallOn) {
    game.wallAngle += dt * (L6.wall.spin || 100);   // 匀速转圈，永不停

    // 转到位之后【不停】：墙压在这儿，右侧（x>100）的人持续被压死
    // 死亡区 = 墙的上半段扫过的那整片三角区域
    //   顶点：转轴(250,450) + 天花板左(250,0) + 天花板右(950,0)
    //   人在这片区域里 = 被扫到 → 死；跑到转轴左边（真门那一侧）才安全
    var gw0 = wallGeom();
    if (gw0) {   // 没有安全区：只判【转轴上半部分】的杆（下半部分可以从下面钻过去）
      var NK = 34, hitW = false;
      for (var ki = 0; ki <= NK; ki++) {
        var kt = ki / NK;
        var kx = gw0.upX + (gw0.ftX - gw0.upX) * kt;
        var ky = gw0.upY + (gw0.ftY - gw0.upY) * kt;
        if (kx > p.x - 13 && kx < p.x + p.w + 13 && ky > p.y - 13 && ky < p.y + p.h + 13) { hitW = true; break; }
      }
      if (hitW) { die(); return; }
    }
    // 拿到钥匙的代价：墙压下来（0.45 秒后必死）—— 这就是"不错的祭品"
    if (game.keyThisLife && game.keyGetT > 0.45 && game.keyGetT < 0.55) { die(); return; }
  }

  // 3) 按按钮后跑到假门那边：原来墙的位置长出一堵新的墙，把回头路彻底堵死
  // 新墙：按完按钮 + 人真的走到假门那儿，才会从地面升起来堵死退路
  if (L6.wall && game.buttonPressed && !game.newWallDone && L6.fakeGoal) {
    var fg0 = L6.fakeGoal;
    if (p.x < fg0.x + fg0.w && p.x + p.w > fg0.x && p.y < fg0.y + fg0.h && p.y + p.h > fg0.y) {
      game.newWallDone = true;
      game.newWallT = 0;
      Sound.sfxTrap(); game.shake = 12;
    }
  }
  if (game.newWallDone) {
    game.newWallT += dt;
    var riseH = Math.min(470, (game.newWallT / 0.32) * 470);      // 0.32 秒从地面升到顶
    var nw = { x: 238, y: 470 - riseH, w: 24, h: riseH };
    game.newWallRect = nw;
    if (aabb(p, nw)) {
      if (p.x + p.w / 2 > nw.x + nw.w / 2) p.x = nw.x + nw.w;
      else p.x = nw.x - p.w;
      p.vx = 0;
    }
  }

  // ===== goalHidden（2-5）：一开始连门都没有，按下按钮后才显现 =====
  if (L6.goalHidden && game.buttonPressed && game.goalReveal < 1) {
    game.goalReveal = Math.min(1, game.goalReveal + dt / (L6.goalRevealTime || 1.6));
  }

  // ===== 假门（初始隐藏，走近才出现）=====
  if (L6.fakeGoal) {
    var fg = L6.fakeGoal;
    // 没有 hidden 的假门：关卡一开始就在
    if (!fg.hidden) game.fakeGoalShown = true;
    // 有 hidden 的：人走到 triggerX 才突然出现
    if (!game.fakeGoalShown && p.x + p.w > (fg.triggerX || 700)) {
      game.fakeGoalShown = true;
      Sound.sfxTrap(); game.shake = 5;
    }
    if (game.fakeGoalShown && !game.fakeGoalDead) {
      if (p.x < fg.x + fg.w && p.x + p.w > fg.x && p.y < fg.y + fg.h && p.y + p.h > fg.y) {
        die(); return;                   // 假门：没按按钮，碰到直接死
      }
    }
    // 真门计时：有按钮的关按按钮触发；没按钮的关退回"走到触发点"触发
    if (game.goalReveal < 1) {
      var revealNow = game.buttonPressed;
      if (!L6.button && (L6.goalTriggerX || 0)) {
        if (!game.revealStarted && p.x + p.w / 2 > L6.goalTriggerX) game.revealStarted = true;
        revealNow = game.revealStarted;
      }
      if (revealNow) game.goalReveal = Math.min(1, game.goalReveal + dt / (L6.goalRevealTime || 3.5));
    }
  }

  // 金币：真的吃了给个清脆音效；假的一碰就炸（用音效吓你一跳）
  for (var ci = 0; ci < game.coins.length; ci++) {
    var co = game.coins[ci];
    co.t += dt;
    if (co.got) continue;
    if (Math.abs(p.x + p.w / 2 - co.x) < 20 && Math.abs(p.y + p.h / 2 - co.y) < 22) {
      if (co.fake) { Sound.sfxBoom(); die(); return; }
      co.got = true; Sound.sfxCoin();
      if (co.flip) { game.flipT = 0; Sound.sfxTrap(); }     // 吃到"翻板金币"→整块地板开始翻
    }
  }

  // 捡钥匙：碰到就永久到手 —— 哪怕这一下你摔死了、或者踩刺死了，钥匙也留下
  for (var ki = 0; ki < game.keys.length; ki++) {
    var kk = game.keys[ki];
    kk.t += dt;
    if (kk.got) continue;
    // 3-3：墙缩进后 keyReveal=true，隐藏的钥匙才浮现
    if (kk.hidden && game.keyReveal && kk.show < 1) kk.show = Math.min(1, kk.show + dt * 2.5);
    // 出场：一开始收着，玩家走过触发点之后慢慢浮现
    if (kk.gone) continue;
    // 检查点一：人得先跑到 armX 那边去
    if (kk.armX !== null && !kk.armed && p.x + p.w / 2 > kk.armX) kk.armed = true;
    // 检查点二：再回到出发点（triggerX 左边），机关才真正启动
    if (kk.armX !== null && !kk.started) {
      if (kk.armed && p.x + p.w / 2 < kk.triggerX) {
        kk.started = true; Sound.sfxTrap();          // 这时候才听到"机关响了"
      } else continue;
    }
    // 从天掉下来：按钮按下后，y 从起始(-50)一路掉到 dropY
    if (kk.drop && kk.dropY !== undefined) {
      if (kk.onPlatY !== null) {
        // 站到指定高度的平台上才出现
        if (!kk.started && game.buttonPressed && p.ground && Math.abs(p.ground.y - kk.onPlatY) < 6) kk.started = true;
        if (kk.started) kk.y += (kk.dropY - kk.y) * Math.min(1, dt * 6);
      } else if (game.buttonPressed) {
        kk.y += (kk.dropY - kk.y) * Math.min(1, dt * 4);
      }
    }
    if (kk.show < 1) {
      if (!kk.hidden) kk.show = 1;
      else if (kk.revealOnly) { if (!game.keyReveal) continue; kk.show = Math.min(1, kk.show + dt / kk.outT); }
      else if (kk.armX !== null || p.x + p.w / 2 > kk.triggerX) kk.show = Math.min(1, kk.show + dt / kk.outT);
      else continue;                     // 还没浮现，碰不到
    }
    // 浮现完成之后，如果配了 slideTo：就一路从左滑到右，滑到头就消失
    if (kk.slideToX !== null && kk.show >= 1) {
      kk.slideT += dt;
      var sk = Math.min(1, kk.slideT / kk.slideTime);
      kk.x = kk.fx + (kk.slideToX - kk.fx) * sk;
      if (sk >= 1) { kk.gone = true; continue; }   // 滑过去了就没了，只能等下一命
    }
    var kcx = kk.fx + (kk.x - kk.fx) * kk.show;
    var kcy = kk.fy + (kk.y - kk.fy) * kk.show;
    if (Math.abs(p.x + p.w / 2 - kcx) < 26 && Math.abs(p.y + p.h / 2 - kcy) < 28) {
      kk.got = true;
      game.keyThisLife = true;
      game.keyGetT = 0;
      save.keys[CUR.w] = 1;
      writeSave();
      Sound.sfxWin();
      game.flash = '拿到钥匙了';
      game.tauntT = 1.6;
    }
  }

  // 左墙下半段缩进（3-3）：人在底层往左走到一定距离，墙下半截往左缩进，露出钥匙
  if (LEVELS[game.li].platforms.some(function (q) { return q.slideWall; })) {
    var swp = null;
    for (var si2 = 0; si2 < game.plats.length; si2++) if (game.plats[si2].slideWall) swp = game.plats[si2];
    if (swp && p.y > 400 && p.x + p.w / 2 < 190) {
      swp.x = Math.max(-40, swp.x - dt * 220);          // 往左缩进
      if (swp.x <= -39) { swp.noCollide = true; }
      game.keyReveal = true;
    }
  }
  // 左墙收进（旧逻辑，2-5/其它关）
  if (LEVELS[game.li].platforms.some(function (q) { return q.vanishWall; })) {
    var vw = null;
    for (var vi = 0; vi < game.plats.length; vi++) if (game.plats[vi].vanishWall) vw = game.plats[vi];
    if (vw && p.y > 380 && vw.w > 0) {
      vw.w = Math.max(0, vw.w - dt * 130);
      if (vw.w <= 0) { vw.noCollide = true; }
    }
  }

  // 会走的门（3-3）：玩家下到底层(位置触发)后，门才开始往右走
  if (LEVELS[game.li].goalMoveVX && !game.goalDone && !game.goalMoving) {
    var _L = LEVELS[game.li];
    if (_L.goalMoveTriggerX !== undefined) {
      if (p.x + p.w / 2 < _L.goalMoveTriggerX) game.goalMoving = true;   // 横向位置触发
    } else if (p.y > (_L.goalMoveTriggerY || 400)) {
      game.goalMoving = true;
    }
  }
  if (LEVELS[game.li].goalMoveVX && game.goalMoving && !game.goalDone) {
    game.goalX += LEVELS[game.li].goalMoveVX * dt;
    if (LEVELS[game.li].goalStopX !== undefined && game.goalX >= LEVELS[game.li].goalStopX) {
      game.goalX = LEVELS[game.li].goalStopX; game.goalDone = true;
    }
  }

  // 到达终点
  var g0 = LEVELS[game.li].goal;
  var LV2 = LEVELS[game.li];
  // 假门关（fakeGoal）：真门必须完全显现(goalReveal>=1)才能通关，否则就是"看不见的门"不算数
  var canWin = !game.goalDead && game.goalReveal > 0.02;   // 门一出现判定就生效（普通关 goalReveal 恒 1）
  if (canWin) {
    var g = { x: game.goalX, y: g0.y + (game.sinkY || 0), w: g0.w, h: g0.h };
    if (aabb(p, g)) { winLevel(); return; }
  }

  // 一屏一关：把玩家夹在屏幕内，不许走出可视区
  if (p.x < 0) p.x = 0;
  if (p.x + p.w > VW) { p.x = VW - p.w; p.vx = 0; }

  // 相机：关卡宽度 = 视口宽度，所以 maxCam 恒为 0 —— 视角永远锁死，不滚动
  var target = p.x + p.w / 2 - VW * 0.42;
  var maxCam = Math.max(0, LEVELS[game.li].width - VW);
  game.cam += (Math.max(0, Math.min(maxCam, target)) - game.cam) * Math.min(1, dt * 9);
}

function spikeBox(sp) {
  // 弹出动画：尖刺会从底部/顶部"长"出来
  var e = sp.anim;
  if (sp.dir === 'down') {
    var h2 = sp.h * e;
    return { x: sp.x, y: sp.y, w: sp.w, h: h2 };
  }
  var h3 = sp.h * e;
  return { x: sp.x, y: sp.y + (sp.h - h3), w: sp.w, h: h3 };
}

function puff(x, y) {
  for (var i = 0; i < 10; i++) {
    game.particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 240,
      vy: -Math.random() * 200,
      life: 0.35 + Math.random() * 0.25, max: 1, c: '#8b95a5'
    });
  }
}

/* ---------------- 渲染 ---------------- */
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ---------------- 美术：Level Devil 式极简 ----------------
   只用三样东西：纯色块、直线、几何形。
   没有渐变、没有纹理、没有粒子——靠明度分层说话：
     最暗（背景暗红） → 中亮（平台暖棕） → 最亮（亮橙顶边 / 亮黄火柴人）
   之前平台比背景还暗，糊在一起了；现在平台明显提亮，边界一眼可辨。 */
var PAL = {
  bg: '#24060c',          // 背景：一整块暗红（压得很暗）
  bgDeep: '#140305',      // 下半部分更深
  ground: '#7d5a44',      // 平台：暖棕实心（明显比背景亮）★
  groundTop: '#ff8a4a',   // 平台顶边：一条亮橙线
  fake: '#734f38',        // 假地板：只比正常暗一点点
  appear: '#b8561c',      // 突然出现的障碍：跳出来时很显眼
  piston: '#8a3410',      // 从地下钻出来的活塞
  pistonTop: '#ffa04a',
  vanish: '#57402f',      // 一触即碎：暗一档 + 虚线框
  player: '#ffd23f',      // 火柴人：亮黄（全画面最亮）
  pupil: '#2a1206',
  spike: '#ff3b2f',       // 尖刺：纯红（会被大关配色覆盖）
  saw: '#8a3410',         // 锯片（会被大关配色覆盖）
  door: '#3fd18a',        // 出口：纯青
  ink: '#0a0305',
  text: '#ffdcb0', dim: '#a8785e', warn: '#ff5a3c', good: '#5ee6a8',
  /* 选关界面用：锁着的元素 / 很弱的辅助色 */
  locked: '#3a2a22', lockedEdge: '#4d382c', faint: '#5a4436'
};

function drawBackground() {
  // 纯色背景。
  // 之前下半部分会再压深一档（bgDeep），结果那条深色带比机关本身还深，
  // 机关画在上面全被吃掉 —— 玩家根本看不见要躲什么。
  ctx.fillStyle = PAL.bg;
  ctx.fillRect(0, 0, VW, VH);
}

function drawPlatforms() {
  for (var i = 0; i < game.plats.length; i++) {
    var p = game.plats[i];
    if (p.state === 'hidden') continue;
    if (p.state === 'gone') continue;
    var grow = p.appeared > 0 ? 1 - p.appeared / 0.18 : 1;
    ctx.save();
    if (p.appeared > 0) ctx.globalAlpha = 0.35 + 0.65 * grow;

    if (p.kind === 'riseWall') {
      var rwH2 = p.h * p.riseY;
      if (rwH2 > 1) {
        ctx.fillStyle = PAL.piston;
        ctx.fillRect(p.x, p.y - rwH2, p.w, rwH2);
        ctx.fillStyle = PAL.ink;
        ctx.fillRect(p.x, p.y - rwH2, p.w, 5);
      }
      ctx.restore();
      continue;
    }
    if (p.kind === 'vanish') {
      // 和普通平台长得一模一样 —— 不给任何提示，踩上去才知道会缩
      ctx.fillStyle = PAL.ground;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = PAL.groundTop;
      ctx.fillRect(p.x, p.y, p.w, 4);
    } else {
      // 活塞：只保留地面以上的部分，看起来才像"从地里钻出来"。
      // 注意裁剪下边界是「地面表面」= baseY + h，不是 baseY ——
      // 写成 baseY 会把整根活塞都裁掉（活塞本体正好在 baseY ~ baseY+h 之间）。
      if (p.kind === 'piston') {
        ctx.beginPath();
        ctx.rect(p.x - 2, 0, p.w + 4, p.baseY + p.h);
        ctx.clip();
      }
      // 跳板 = 一块板子 + 底下连着弹簧。
      // 没踩时：板子平贴在地面里，弹簧完全压扁 —— 看起来就是普通地面。
      // 踩上去：弹簧伸展，板子被顶起来，到顶就弹飞。
      if (p.kind === 'bounce') {
        var bpop = p.pop || 0;
        if (bpop <= 0.02) continue;                   // 没踩 → 一根线都不画，就是普通地面
        var topY = p.y + p.h;                         // 板子静止时贴着地面
        var rise = 30 * bpop;                         // 板子升起高度
        var by = topY - rise;
        var coilH = 22 * (1 - bpop * 0.85);           // 弹簧剩余高度（越弹越伸展）
        {
          // 弹簧：中间一根立杆 + 上下两圈，画成被压住的样子
          ctx.strokeStyle = PAL.groundTop;
          ctx.lineWidth = 3;
          ctx.beginPath();
          for (var ci = 0; ci <= 8; ci++) {
            var cz = ci / 8;
            var cx2 = p.x + p.w / 2 + (ci % 2 === 0 ? -13 : 13) * (0.45 + 0.55 * cz);
            var cy2 = by + 6 + cz * coilH;
            if (ci === 0) ctx.moveTo(cx2, cy2); else ctx.lineTo(cx2, cy2);
          }
          ctx.stroke();
        }
        // 板子：一块比跳板略宽的厚板
        ctx.fillStyle = PAL.ground;
        ctx.fillRect(p.x - 3, by, p.w + 6, 9);
        ctx.fillStyle = PAL.groundTop;
        ctx.fillRect(p.x - 3, by, p.w + 6, 3);
        continue;
      }
      // 翻板：绕自己中心转
      if (p.kind === 'flip' && game.flipT >= 0) {
        ctx.save();
        ctx.translate(p.x + p.w / 2, p.y + p.h / 2);
        ctx.rotate(Math.PI * Math.min(1, game.flipT));
        ctx.fillStyle = PAL.ground;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
        ctx.fillStyle = PAL.groundTop;
        ctx.fillRect(-p.w / 2, -p.h / 2, p.w, 4);
        ctx.restore();
        continue;
      }
      // 实心块 + 一条亮橙顶边（假地板 / 消失板也走这条，外观不给任何提示）
      ctx.fillStyle = p.kind === 'piston' ? PAL.piston
                    : p.kind === 'appear' ? PAL.appear : PAL.ground;
      ctx.fillRect(p.x, p.y, p.w, p.h);
      ctx.fillStyle = p.kind === 'piston' ? PAL.pistonTop : PAL.groundTop;
      ctx.fillRect(p.x, p.y, p.w, 4);
    }
    ctx.restore();
  }
}

function drawSpikes() {
  for (var i = 0; i < game.spikes.length; i++) {
    var sp = game.spikes[i];
    if (!sp.shown) continue;
    if (sp.onPop && !game.popFired) continue;      // 保险：没弹起来就不画
    var box = spikeBox(sp);
    var n = Math.max(1, Math.round(box.w / 16));   // 15px 的窄刺就画 1 根，49px 画 3 根
    var step = box.w / n;
    // 纯色三角，一次画完，没有描边也没有高光
    ctx.fillStyle = PAL.spike;
    ctx.beginPath();
    for (var a = 0; a < n; a++) {
      var x0 = sp.x + a * step;
      // 尖不在正中，左右交替偏一点；再让高度轻微高低错落 —— 别像等边三角形
      var lean = (a % 2 === 0) ? 0.34 : 0.66;   // 尖还是左右交替偏一点
      var gapW = step * 0.15;                   // 间隙 15%，和门口那排一致
      if (sp.dir === 'down') {
        ctx.moveTo(x0 + gapW, box.y);
        ctx.lineTo(x0 + step * lean, box.y + box.h);
        ctx.lineTo(x0 + step - gapW, box.y);
      } else {
        ctx.moveTo(x0 + gapW, box.y + box.h);
        ctx.lineTo(x0 + step * lean, box.y);          // 全部等高（整齐）
        ctx.lineTo(x0 + step - gapW, box.y + box.h);
      }
      ctx.closePath();
    }
    ctx.fill();
  }
}

/* 锯片：外圈三角尖齿 + 盘体 + 中心孔。会自转，也会沿路径来回滚 */
function drawSaws() {
  for (var i = 0; i < game.saws.length; i++) {
    var s = game.saws[i], r = s.r;
    if (!s.shown) continue;
    ctx.save();
    ctx.translate(s.x, s.y);
    ctx.rotate(s.rot);

    // 外圈尖齿
    ctx.fillStyle = PAL.saw;
    ctx.beginPath();
    var N = 12;
    for (var k = 0; k < N; k++) {
      var a0 = (k / N) * Math.PI * 2;
      var a1 = ((k + 0.42) / N) * Math.PI * 2;
      var a2 = ((k + 0.84) / N) * Math.PI * 2;
      ctx.lineTo(Math.cos(a0) * r * 0.74, Math.sin(a0) * r * 0.74);
      ctx.lineTo(Math.cos(a1) * r, Math.sin(a1) * r);
      ctx.lineTo(Math.cos(a2) * r * 0.74, Math.sin(a2) * r * 0.74);
    }
    ctx.closePath(); ctx.fill();

    // 盘体
    ctx.beginPath(); ctx.arc(0, 0, r * 0.74, 0, 7); ctx.fill();
    // 画锯片：中心孔用背景色，看起来是"穿透"的
    ctx.fillStyle = PAL.bgDeep;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.26, 0, 7); ctx.fill();
    // 中心轴（小圆点），让转动更好辨认
    ctx.fillStyle = PAL.ink;
    ctx.beginPath(); ctx.arc(0, 0, r * 0.09, 0, 7); ctx.fill();
    ctx.restore();
  }
}

/* 金币：真的金色发亮，假的……看起来一模一样（这就是坑） */
function drawCoins() {
  for (var i = 0; i < game.coins.length; i++) {
    var c = game.coins[i];
    if (c.got) continue;
    var bob = Math.sin(c.t * 3) * 2.5;
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.ellipse(c.x, c.y + bob, 9, 11, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#b8901f';
    ctx.beginPath(); ctx.ellipse(c.x, c.y + bob, 5.5, 7, 0, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.65)';
    ctx.beginPath(); ctx.ellipse(c.x - 3, c.y + bob - 3.5, 2.2, 3, 0, 0, 7); ctx.fill();
  }
}

/* 按钮 + 会旋转的墙（2-4 用） */
// 墙的真实几何：上端贴天花板滑动、下端长度固定。返回 {upX,upY,ftX,ftY}
function wallGeom() {
  var L = LEVELS[game.li];
  if (!L.wall) return null;
  var w = L.wall;
  var a = game.wallAngle * Math.PI / 180;
  var ca = Math.cos(a), sa = Math.sin(a);
  return {
    upX: w.pivotX - w.len * ca, upY: w.pivotY - w.len * sa,
    ftX: w.pivotX + w.len * ca, ftY: w.pivotY + w.len * sa,
    w: w.w
  };
}

// 把墙切成若干小方块（用于碰撞）：墙自己转，碰撞跟着转
function wallBlocks() {
  var g = wallGeom();
  if (!g) return [];
  var N = 12, out = [], hw = g.w / 2;
  for (var i = 0; i < N; i++) {
    var t0 = i / N, t1 = (i + 1) / N;
    var x0 = g.upX + (g.ftX - g.upX) * t0, y0 = g.upY + (g.ftY - g.upY) * t0;
    var x1 = g.upX + (g.ftX - g.upX) * t1, y1 = g.upY + (g.ftY - g.upY) * t1;
    out.push({
      x: Math.min(x0, x1) - hw, y: Math.min(y0, y1) - hw,
      w: Math.abs(x1 - x0) + g.w, h: Math.abs(y1 - y0) + g.w
    });
  }
  return out;
}

function drawButtonWall() {
  var L = LEVELS[game.li];

  // 按钮（2-5：等平台从空气里长出来才显示）
  if (L.button && game.buttonVisible) {
    var b = L.button;
    var pressed = game.buttonPressed;
    var bh = pressed ? 6 : 18;                     // 按下会扁下去
    var isUp = !!b.upsideDown;
    var by = isUp ? b.y : b.y + b.h - bh;   // 倒按钮贴着平台下沿
    ctx.fillStyle = pressed ? '#8c2f22' : '#e0432f';
    ctx.fillRect(b.x, by, b.w, bh);
    ctx.fillStyle = pressed ? '#5a1c14' : '#ff6b52';
    ctx.fillRect(b.x, isUp ? by + bh - 5 : by, b.w, 5);
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(b.x + b.w / 2, b.y + b.h - bh - 3, 3, 0, 7); ctx.fill();
  }

  // 墙：一根从天花板斜下来的杆，它自己转（碰撞跟着转）
  if (L.wall) {
    var g = wallGeom();
    var w = L.wall;
    var px = w.pivotX, py = w.pivotY;
    var upX = g.upX, upY = g.upY, ftX = g.ftX, ftY = g.ftY;
    ctx.globalAlpha = 1;
    ctx.lineCap = 'round';
    ctx.strokeStyle = PAL.ground;
    ctx.lineWidth = w.w;
    ctx.beginPath(); ctx.moveTo(upX, upY); ctx.lineTo(ftX, ftY); ctx.stroke();
    ctx.strokeStyle = PAL.groundTop;
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(upX, upY); ctx.lineTo(ftX, ftY); ctx.stroke();
  }

  // 新墙：从地面伸出来（把回头路堵死）
  if (game.newWallRect) {
    var nr = game.newWallRect;
    ctx.fillStyle = PAL.ground;
    ctx.fillRect(nr.x, nr.y, nr.w, nr.h);
    ctx.fillStyle = PAL.groundTop;
    ctx.fillRect(nr.x, nr.y, nr.w, 5);
    // 升起时的尘土感
    if (game.newWallT < 0.5) {
      ctx.globalAlpha = Math.max(0, 1 - game.newWallT / 0.5);
      ctx.fillStyle = PAL.ink;
      for (var di = 0; di < 3; di++) {
        var dx2 = nr.x + (di - 1) * 12;
        ctx.fillRect(dx2, 470 - 6 - di * 4, 6, 6);
      }
      ctx.globalAlpha = 1;
    }
  }
}

/* 骷髅头钥匙：一个骷髅脑袋 + 下面一根钥匙杆 */
function drawSkullKey(x, y, s, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.translate(x, y); ctx.scale(s, s);
  // 钥匙杆
  ctx.strokeStyle = '#d8d2c4'; ctx.lineWidth = 3.2; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(0, 8); ctx.lineTo(0, 22);
  ctx.moveTo(0, 17); ctx.lineTo(6, 17); ctx.moveTo(0, 21); ctx.lineTo(5, 21); ctx.stroke();
  // 骷髅头
  ctx.fillStyle = '#e8e2d4';
  ctx.beginPath();
  ctx.arc(0, -2, 11, Math.PI, 0);
  ctx.lineTo(11, 5);
  ctx.quadraticCurveTo(8, 12, 4, 10);
  ctx.lineTo(-4, 10);
  ctx.quadraticCurveTo(-8, 12, -11, 5);
  ctx.closePath(); ctx.fill();
  // 眼窝（黑洞）
  ctx.fillStyle = '#120303';
  ctx.beginPath(); ctx.ellipse(-4.4, -2, 3.6, 4.2, 0, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(4.4, -2, 3.6, 4.2, 0, 0, 7); ctx.fill();
  // 鼻孔 + 牙缝
  ctx.beginPath(); ctx.moveTo(0, 3); ctx.lineTo(-1.6, 7); ctx.lineTo(1.6, 7); ctx.closePath(); ctx.fill();
  ctx.fillRect(-2.6, 8.6, 1.4, 3);
  ctx.fillRect(1.2, 8.6, 1.4, 3);
  ctx.restore();
}

function drawKeys() {
  for (var i = 0; i < game.keys.length; i++) {
    var k = game.keys[i];
    if (k.got || k.gone || k.show <= 0) continue;
    var e = k.show * k.show * (3 - 2 * k.show);         // smoothstep
    var bob = Math.sin(k.t * 2.6) * 3 * e;
    var kx = k.fx + (k.x - k.fx) * e;                   // 从"藏身处"滑到"该在的地方"
    var ky = k.fy + (k.y - k.fy) * e;
    drawSkullKey(kx, ky + bob, 1.25, e);
  }
}

/* 落球：会反弹，弹够次数就朝你飞 */
function drawBalls() {
  for (var i = 0; i < game.balls.length; i++) {
    var b = game.balls[i];
    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.spin);
    // 纯色大圆球（照参考：没有高光也没有中心点）
    ctx.fillStyle = b.homing ? '#c0392b' : PAL.spike;
    ctx.beginPath(); ctx.arc(0, 0, b.r, 0, 7); ctx.fill();
    ctx.restore();
  }
}

function drawGoal() {
  var L = LEVELS[game.li];
  // 假终点关：先画那扇假的（长得和真门一样），真门按进度淡入
  if (L.fakeGoal) {
    if (game.fakeGoalShown) drawOneDoor(L.fakeGoal, 1);   // 假门走近才出现
    if (game.state === 'win' && game.winDoor) {
      drawOneDoor({ x: game.goalX, y: L.goal.y, w: L.goal.w, h: L.goal.h }, 1, game.winDoor.k);   // 通关：真门关门动画
    } else {
      drawOneDoor({ x: game.goalX, y: L.goal.y, w: L.goal.w, h: L.goal.h }, game.goalReveal, 1);
    }
    return;
  }
  if (!game.goalDead || game.sinkY > 0) {
    if (game.state === 'win' && game.winDoor) drawOneDoor({ x: game.goalX, y: L.goal.y, w: L.goal.w, h: L.goal.h }, 1, game.winDoor.k);
    else drawOneDoor({ x: game.goalX, y: L.goal.y, w: L.goal.w, h: L.goal.h }, L.goalHidden ? game.goalReveal : 1, 1);   // 用 game.goalX（会走的门）
  }
}

function drawOneDoor(g, alpha, closeK) {
  if (alpha <= 0.01) return;
  g = { x: g.x, y: g.y + (game.sinkY || 0), w: g.w, h: g.h };   // 门跟着一起沉
  var k = Math.max(0, Math.min(1, alpha));
  var ck = (closeK === undefined ? 1 : Math.max(0, Math.min(1, closeK)));
  var w = g.w * ck;                          // 关门：宽度收拢
  if (w < 0.6) return;
  var x = g.x + (g.w - w) / 2;
  var y = g.y, h = g.h, r = w / 2;

  // 门口透出来的光（noGlow 的关不画）
  if (!(LEVELS[game.li] && LEVELS[game.li].noGlow)) {
  ctx.save();
  ctx.globalAlpha = 0.22 * k;
  ctx.fillStyle = PAL.door;
  ctx.beginPath(); ctx.ellipse(x + r, y + h * 0.55, w * 1.35, h * 0.85, 0, 0, 7); ctx.fill();
  ctx.restore();
  }

  ctx.globalAlpha = k;                       // 整个门跟着 alpha 一起淡入
  // 门框（比门洞大一圈）
  ctx.beginPath();
  ctx.moveTo(x - 4, y + h + 4); ctx.lineTo(x - 4, y + r);
  ctx.arc(x + r, y + r, r + 4, Math.PI, 0);
  ctx.lineTo(x + w + 4, y + h + 4);
  ctx.closePath();
  ctx.fillStyle = PAL.ink; ctx.fill();

  // 门洞：拱形，上亮下暗
  ctx.beginPath();
  ctx.moveTo(x, y + h); ctx.lineTo(x, y + r);
  ctx.arc(x + r, y + r, r, Math.PI, 0);
  ctx.lineTo(x + w, y + h);
  ctx.closePath();
  var gd = ctx.createLinearGradient(0, y, 0, y + h);
  gd.addColorStop(0, PAL.door);
  gd.addColorStop(1, '#1d7a50');
  ctx.fillStyle = gd; ctx.fill();

  // 洞底压暗，看起来"通到别处去了"
  ctx.save();
  ctx.globalAlpha = 0.4;
  var gd2 = ctx.createLinearGradient(0, y + h * 0.45, 0, y + h);
  gd2.addColorStop(0, 'rgba(0,0,0,0)');
  gd2.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = gd2;
  ctx.beginPath();
  ctx.moveTo(x, y + h); ctx.lineTo(x, y + r);
  ctx.arc(x + r, y + r, r, Math.PI, 0);
  ctx.lineTo(x + w, y + h);
  ctx.closePath(); ctx.fill();
  ctx.restore();
  ctx.globalAlpha = 1;   // 恢复
}

function drawArrows() {
  ctx.save();
  for (var i = 0; i < game.arrows.length; i++) {
    var a = game.arrows[i];
    ctx.save();
    ctx.translate(a.x, a.y);
    if (a.dir === 'left') ctx.rotate(Math.PI);
    if (a.dir === 'up') ctx.rotate(-Math.PI / 2);
    if (a.dir === 'down') ctx.rotate(Math.PI / 2);
    ctx.beginPath();
    ctx.moveTo(34, 0);
    ctx.lineTo(-6, -20);
    ctx.lineTo(2, -9);
    ctx.lineTo(-30, -9);
    ctx.lineTo(-30, 9);
    ctx.lineTo(2, 9);
    ctx.lineTo(-6, 20);
    ctx.closePath();
    ctx.fillStyle = '#ffb020';
    ctx.fill();
    ctx.restore();
  }
  ctx.restore();
}

/* 火柴人：头 + 一根身体 + 四肢，动作全靠关节摆动
   走路 → 手脚交替摆；跳跃 → 蜷腿举臂；下落 → 张腿摊手；站着 → 轻微呼吸 */
function drawPlayer() {
  if (game.state === 'dead') return;
  var p = game.p;
  var t = p.anim || 0;
  var st = p.animState || 'idle';
  var cx = p.x + p.w / 2;
  var top = p.y, bottom = p.y + p.h;

  var bob = 0, legA = 0, legB = 0, armA = 0, armB = 0;

  if (st === 'walk') {
    var sw = Math.sin(t * 13);
    legA = sw * 6.5; legB = -sw * 6.5;
    armA = -sw * 5.5; armB = sw * 5.5;
    bob = -Math.abs(sw) * 1.6;
  } else if (st === 'idle') {
    bob = Math.sin(t * 2.6) * 1.2;
    armA = 2; armB = -2;
  } else if (st === 'jump') {
    legA = -3; legB = 6; armA = -8; armB = 8;   // 蜷腿、举臂
  } else {
    legA = -7; legB = 7; armA = -6; armB = 6;   // 下落：张腿摊手
  }

  var headR = 5.2;
  var headY = top + headR + 1 + bob;
  var neckY = headY + headR + 0.5;
  var hipY = neckY + 8.5;
  var shoulderY = neckY + 2;

  ctx.save();
  ctx.strokeStyle = PAL.player;
  ctx.lineWidth = 3.4;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  // 身体
  ctx.beginPath();
  ctx.moveTo(cx, neckY);
  ctx.lineTo(cx, hipY);
  ctx.stroke();
  // 手臂
  ctx.beginPath();
  ctx.moveTo(cx, shoulderY); ctx.lineTo(cx + armA, shoulderY + 7.5);
  ctx.moveTo(cx, shoulderY); ctx.lineTo(cx + armB, shoulderY + 7.5);
  ctx.stroke();
  // 腿
  ctx.beginPath();
  ctx.moveTo(cx, hipY); ctx.lineTo(cx + legA, bottom);
  ctx.moveTo(cx, hipY); ctx.lineTo(cx + legB, bottom);
  ctx.stroke();
  // 头
  ctx.beginPath();
  ctx.arc(cx, headY, headR, 0, Math.PI * 2);

/* 两色混合：t=0 取 a，t=1 取 b（用来把主题色压暗做"锁着"的门） */
function mix(a, b, t) {
  var x = parseInt(a.slice(1), 16), y = parseInt(b.slice(1), 16);
  var r = Math.round(((x >> 16) & 255) * (1 - t) + ((y >> 16) & 255) * t);
  var g = Math.round(((x >> 8) & 255) * (1 - t) + ((y >> 8) & 255) * t);
  var bl = Math.round((x & 255) * (1 - t) + (y & 255) * t);
  return '#' + ((1 << 24) + (r << 16) + (g << 8) + bl).toString(16).slice(1);
}

function keyIcon(x, y, s, color, filled) {

  ctx.beginPath(); ctx.moveTo(-1, -2); ctx.lineTo(11, -2);
  ctx.moveTo(6, -2); ctx.lineTo(6, 4); ctx.moveTo(11, -2); ctx.lineTo(11, 5);
