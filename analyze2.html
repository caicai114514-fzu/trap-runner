<!DOCTYPE html><html><head><meta charset="utf-8"></head><body>
<script>
fetch('chainsaw.m4a').then(r=>r.arrayBuffer()).then(buf=>{
  var ac = new (window.AudioContext||window.webkitAudioContext)();
  ac.decodeAudioData(buf).then(function(a){
    var ch = a.getChannelData(0), sr = a.sampleRate;
    console.log('ANALYSIS dur='+a.duration.toFixed(3)+' sr='+sr);
    // 平均功率谱：把整段分 100 段，每段做简单频谱峰值
    // 用 Goertzel 找 50~6000Hz 的主频
    var N = a.length, fft=8192, mid = Math.floor(N/2);
    var seg = new Float32Array(fft);
    for(var i=0;i<fft;i++) seg[i]=ch[mid+i];
    function g(f){ var w=2*Math.PI*f/sr,c=2*Math.cos(w),s0=0,s1=0,s2=0;
      for(var i=0;i<fft;i++){s0=seg[i]+c*s1-s2;s2=s1;s1=s0;}
      return s1*s1+s2*s2-c*s1*s2; }
    var pk=[];
    for(var f=50;f<=6000;f+=50) pk.push([f,g(f)]);
    pk.sort((a,b)=>b[1]-a[1]);
    var mx=pk[0][1], top=[];
    for(var i=0;i<15;i++) top.push(pk[i][0]+'Hz='+(pk[i][1]/mx).toFixed(2));
    console.log('PEAKS '+top.join(' '));
    // 包络：每 0.2 秒的 RMS
    var env=[];
    for(var t=0;t<a.duration;t+=0.2){
      var s=Math.floor(t*sr), e=Math.floor((t+0.2)*sr), sum=0;
      for(var j=s;j<e;j++) sum+=ch[j]*ch[j];
      env.push(Math.sqrt(sum/(e-s)).toFixed(2));
    }
    console.log('ENV '+env.join(' '));
    document.title='DONE';
  });
});
</script></body></html>
